<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonar Maze</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;

</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        <div id="uiLayer">
            <div id="pulses">Pulses: 15</div>
        </div>

        <div id="joystickZone">
            <div id="joystick">
                <div id="joystickKnob"></div>
            </div>
        </div>

        <div class="overlay" id="mainMenu">
            <h1>SONAR MAZE</h1>
            <p>Find the green exit. Avoid red entities.<br>You have 15 sonar pulses to reveal invisible walls.<br>Move:
                WASD/Arrows or Joystick.<br>Sonar: Space or Tap.</p>
            <button id="btnStart">START GAME</button>
        </div>

        <div class="overlay hidden" id="pauseMenu">
            <h1>PAUSED</h1>
            <button id="btnResume">RESUME</button>
        </div>

        <div class="overlay hidden" id="gameOverMenu">
            <h1 id="endTitle">GAME OVER</h1>
            <p id="endDesc">You were caught in the darkness.</p>
            <button id="btnRestart">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 25, ROWS = 20, CELL = 40;

        let gameState = 'MENU';
        let lastTime = 0, time = 0;
        let player = {}, exit = {}, enemies = [], waves = [], segments = [], cellSegments = [];
        let pulses = 15, lastPulseTime = 0, pulseTimeout = null;
        let keys = {};
        let joy = { active: false, nx: 0, ny: 0, id: null };

        const Audio = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playPing() {
                if (!this.ctx) return;
                let t = this.ctx.currentTime;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1400, t);
                osc.frequency.exponentialRampToValueAtTime(180, t + 0.9);
                gain.gain.setValueAtTime(1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.9);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t); osc.stop(t + 0.9);
            },
            playDeath() {
                if (!this.ctx) return;
                let t = this.ctx.currentTime;
                let osc1 = this.ctx.createOscillator();
                let osc2 = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc1.type = 'square'; osc2.type = 'sawtooth';
                osc1.frequency.setValueAtTime(150, t);
                osc1.frequency.exponentialRampToValueAtTime(30, t + 0.6);
                osc2.frequency.setValueAtTime(90, t);
                osc2.frequency.exponentialRampToValueAtTime(30, t + 0.6);
                gain.gain.setValueAtTime(1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.6);
                osc1.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
                osc1.start(t); osc2.start(t); osc1.stop(t + 0.6); osc2.stop(t + 0.6);
            },
            playVictory() {
                if (!this.ctx) return;
                let freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, i) => {
                    let t = this.ctx.currentTime + i * 0.15;
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
                    gain.gain.linearRampToValueAtTime(0, t + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(t); osc.stop(t + 0.3);
                });
            }
        };

        function generateMaze() {
            let grid = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    grid.push({ x, y, walls: [true, true, true, true], visited: false });
                }
            }

            function idx(x, y) { return (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? -1 : y * COLS + x; }

            let stack = [], curr = grid[0];
            curr.visited = true;

            while (true) {
                let n = [];
                let top = grid[idx(curr.x, curr.y - 1)];
                let right = grid[idx(curr.x + 1, curr.y)];
                let bottom = grid[idx(curr.x, curr.y + 1)];
                let left = grid[idx(curr.x - 1, curr.y)];

                if (top && !top.visited) n.push({ c: top, dir: 0 });
                if (right && !right.visited) n.push({ c: right, dir: 1 });
                if (bottom && !bottom.visited) n.push({ c: bottom, dir: 2 });
                if (left && !left.visited) n.push({ c: left, dir: 3 });

                if (n.length > 0) {
                    let next = n[Math.floor(Math.random() * n.length)];
                    stack.push(curr);
                    curr.walls[next.dir] = false;
                    next.c.walls[(next.dir + 2) % 4] = false;
                    curr = next.c;
                    curr.visited = true;
                } else if (stack.length > 0) {
                    curr = stack.pop();
                } else {
                    break;
                }
            }

            for (let i = 0; i < 25; i++) {
                let x = Math.floor(Math.random() * (COLS - 2)) + 1;
                let y = Math.floor(Math.random() * (ROWS - 2)) + 1;
                let c = grid[idx(x, y)];
                let dir = Math.floor(Math.random() * 4);
                c.walls[dir] = false;
                if (dir === 0) grid[idx(x, y - 1)].walls[2] = false;
                if (dir === 1) grid[idx(x + 1, y)].walls[3] = false;
                if (dir === 2) grid[idx(x, y + 1)].walls[0] = false;
                if (dir === 3) grid[idx(x - 1, y)].walls[1] = false;
            }

            let tempSegs = [];
            for (let c of grid) {
                let x = c.x * CELL, y = c.y * CELL;
                if (c.walls[0]) tempSegs.push({ a: { x, y }, b: { x: x + CELL, y } });
                if (c.walls[1]) tempSegs.push({ a: { x: x + CELL, y }, b: { x: x + CELL, y: y + CELL } });
                if (c.walls[2]) tempSegs.push({ a: { x, y: y + CELL }, b: { x: x + CELL, y: y + CELL } });
                if (c.walls[3]) tempSegs.push({ a: { x, y }, b: { x, y: y + CELL } });
            }

            segments = [];
            for (let s of tempSegs) {
                let dup = false;
                for (let u of segments) {
                    if ((s.a.x === u.a.x && s.a.y === u.a.y && s.b.x === u.b.x && s.b.y === u.b.y) ||
                        (s.a.x === u.b.x && s.a.y === u.b.y && s.b.x === u.a.x && s.b.y === u.a.y)) {
                        dup = true; break;
                    }
                }
                if (!dup) segments.push({ a: s.a, b: s.b, glow: 0 });
            }

            cellSegments = new Array(COLS * ROWS).fill(null).map(() => []);
            for (let seg of segments) {
                let minX = Math.floor(Math.min(seg.a.x, seg.b.x) / CELL);
                let maxX = Math.floor(Math.max(seg.a.x, seg.b.x) / CELL);
                let minY = Math.floor(Math.min(seg.a.y, seg.b.y) / CELL);
                let maxY = Math.floor(Math.max(seg.a.y, seg.b.y) / CELL);
                for (let y = minY - 1; y <= maxY + 1; y++) {
                    for (let x = minX - 1; x <= maxX + 1; x++) {
                        let id = idx(x, y);
                        if (id !== -1) cellSegments[id].push(seg);
                    }
                }
            }
        }

        function initGame() {
            generateMaze();
            player = { x: CELL / 2, y: CELL / 2, vx: 0, vy: 0, lastVx: 1, lastVy: 0, radius: 12 };
            exit = { x: (COLS - 0.5) * CELL, y: (ROWS - 0.5) * CELL };

            enemies = [];
            for (let i = 0; i < 3; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * (COLS / 2) + COLS / 2) * CELL + CELL / 2;
                    ey = Math.floor(Math.random() * ROWS) * CELL + CELL / 2;
                } while (Math.hypot(ex - player.x, ey - player.y) < 250 || Math.hypot(ex - exit.x, ey - exit.y) < 150);
                let a = Math.random() * Math.PI * 2;
                enemies.push({ x: ex, y: ey, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, radius: 12 });
            }

            pulses = 15;
            document.getElementById('pulses').innerText = `Pulses: ${pulses}`;
            waves = [];
            if (pulseTimeout) clearTimeout(pulseTimeout);

            gameState = 'PLAYING';
            document.querySelectorAll('.overlay').forEach(e => e.classList.add('hidden'));
            keys = {};
            lastTime = performance.now();
        }

        function gameOver(win, msg = "You were caught in the darkness.") {
            gameState = 'GAMEOVER';
            if (pulseTimeout) clearTimeout(pulseTimeout);
            let title = document.getElementById('endTitle');
            let desc = document.getElementById('endDesc');
            document.getElementById('gameOverMenu').classList.remove('hidden');
            if (win) {
                title.innerText = "VICTORY";
                title.style.color = "#0f0";
                title.style.textShadow = "0 0 15px #0f0";
                desc.innerText = "You have escaped the maze!";
                Audio.playVictory();
            } else {
                title.innerText = "GAME OVER";
                title.style.color = "#f00";
                title.style.textShadow = "0 0 15px #f00";
                desc.innerText = msg;
                Audio.playDeath();
            }
        }

        function fireSonar() {
            let now = performance.now();
            if (now - lastPulseTime < 1000 || pulses <= 0) return;
            lastPulseTime = now;
            pulses--;
            document.getElementById('pulses').innerText = `Pulses: ${pulses}`;
            Audio.playPing();
            waves.push({ x: player.x, y: player.y, radius: 0, speed: 700 });

            if (pulses === 0) {
                pulseTimeout = setTimeout(() => {
                    if (gameState === 'PLAYING') gameOver(false, "Out of sonar pulses!");
                }, 4000);
            }
        }

        function closestPoint(p, a, b) {
            let ab = { x: b.x - a.x, y: b.y - a.y };
            let t = ((p.x - a.x) * ab.x + (p.y - a.y) * ab.y) / (ab.x * ab.x + ab.y * ab.y);
            t = Math.max(0, Math.min(1, t));
            return { x: a.x + t * ab.x, y: a.y + t * ab.y };
        }

        function resolveCollisions(ent, isEnemy) {
            let cx = Math.floor(ent.x / CELL);
            let cy = Math.floor(ent.y / CELL);
            let id = cy * COLS + cx;
            let checkWalls = cellSegments[id] || [];

            for (let w of checkWalls) {
                let cl = closestPoint(ent, w.a, w.b);
                let dx = ent.x - cl.x;
                let dy = ent.y - cl.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < ent.radius) {
                    let nx, ny;
                    if (dist < 0.001) {
                        let abx = w.b.x - w.a.x;
                        let aby = w.b.y - w.a.y;
                        nx = -aby; ny = abx;
                        let len = Math.hypot(nx, ny);
                        nx /= len; ny /= len;
                    } else {
                        nx = dx / dist; ny = dy / dist;
                    }

                    let overlap = ent.radius - dist;
                    ent.x += nx * (overlap + 0.01);
                    ent.y += ny * (overlap + 0.01);

                    if (isEnemy) {
                        let dot = ent.vx * nx + ent.vy * ny;
                        ent.vx = ent.vx - 2 * dot * nx;
                        ent.vy = ent.vy - 2 * dot * ny;
                        ent.vx += (Math.random() - 0.5) * 20;
                        ent.vy += (Math.random() - 0.5) * 20;
                        let speed = Math.hypot(ent.vx, ent.vy);
                        ent.vx = (ent.vx / Math.max(speed, 1)) * 150;
                        ent.vy = (ent.vy / Math.max(speed, 1)) * 150;
                    } else {
                        let dot = ent.vx * nx + ent.vy * ny;
                        if (dot < 0) {
                            ent.vx -= dot * nx;
                            ent.vy -= dot * ny;
                        }
                    }
                }
            }
            ent.x = Math.max(ent.radius, Math.min(COLS * CELL - ent.radius, ent.x));
            ent.y = Math.max(ent.radius, Math.min(ROWS * CELL - ent.radius, ent.y));
        }

        function updatePhysics(dt) {
            const steps = 4;
            const sDt = dt / steps;
            for (let s = 0; s < steps; s++) {
                player.x += player.vx * sDt;
                player.y += player.vy * sDt;
                resolveCollisions(player, false);
                for (let e of enemies) {
                    e.x += e.vx * sDt;
                    e.y += e.vy * sDt;
                    resolveCollisions(e, true);
                }
            }
        }

        function render() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            for (let seg of segments) {
                if (seg.glow > 0.01) {
                    ctx.strokeStyle = `rgba(0, 255, 255, ${seg.glow})`;
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 15 * seg.glow;
                    ctx.shadowColor = '#0ff';
                    ctx.beginPath();
                    ctx.moveTo(seg.a.x, seg.a.y);
                    ctx.lineTo(seg.b.x, seg.b.y);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;

            ctx.lineWidth = 2;
            for (let w of waves) {
                let a = Math.max(0, 1 - w.radius / 1000);
                if (a > 0.01) {
                    ctx.strokeStyle = `rgba(0, 255, 255, ${a})`;
                    ctx.beginPath();
                    ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            let rExit = 20 + Math.sin(time * 5) * 5;
            ctx.save();
            ctx.translate(exit.x, exit.y);
            ctx.beginPath(); ctx.arc(0, 0, rExit, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.4)'; ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#0f0'; ctx.fill();
            ctx.restore();

            for (let e of enemies) {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.globalCompositeOperation = 'lighter';
                ctx.beginPath(); ctx.arc(0, 0, e.radius * 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 0, 0.2)'; ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                ctx.rotate(Math.atan2(e.vy, e.vx));
                ctx.fillStyle = '#f00';
                ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, 12); ctx.lineTo(-4, 0); ctx.lineTo(-8, -12); ctx.fill();
                ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(4, 0, 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(5, 0, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath(); ctx.arc(0, 0, player.radius * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.15)'; ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            let angle = Math.atan2(player.lastVy, player.lastVx);
            if (Math.hypot(player.vx, player.vy) > 10) {
                angle = Math.atan2(player.vy, player.vx);
                player.lastVx = player.vx; player.lastVy = player.vy;
            }
            ctx.rotate(angle);
            let legCycle = (Math.hypot(player.vx, player.vy) > 10) ? Math.sin(time * 15) * 6 : 0;
            ctx.fillStyle = '#0a8';
            ctx.beginPath(); ctx.arc(-5 + legCycle, -7, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-5 - legCycle, 7, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(4, -5, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, 5, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(5, -5, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, 5, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (!lastTime) lastTime = timestamp;
            let dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (gameState !== 'PLAYING') return;
            time += dt;

            let ax = 0, ay = 0;
            if (keys['w'] || keys['ArrowUp']) ay -= 1;
            if (keys['s'] || keys['ArrowDown']) ay += 1;
            if (keys['a'] || keys['ArrowLeft']) ax -= 1;
            if (keys['d'] || keys['ArrowRight']) ax += 1;

            if (joy.active) { ax = joy.nx; ay = joy.ny; }

            let len = Math.hypot(ax, ay);
            if (len > 0) { ax /= len; ay /= len; }

            let accel = 1500, friction = 8;
            player.vx += ax * accel * dt; player.vy += ay * accel * dt;
            player.vx -= player.vx * friction * dt; player.vy -= player.vy * friction * dt;

            updatePhysics(dt);

            for (let i = waves.length - 1; i >= 0; i--) {
                waves[i].r1 = waves[i].radius;
                waves[i].radius += waves[i].speed * dt;
                waves[i].r2 = waves[i].radius;
                if (waves[i].radius > 1500) waves.splice(i, 1);
            }

            for (let seg of segments) {
                for (let w of waves) {
                    let cl = closestPoint(w, seg.a, seg.b);
                    let minDist = Math.hypot(w.x - cl.x, w.y - cl.y);
                    let maxDist = Math.max(Math.hypot(w.x - seg.a.x, w.y - seg.a.y), Math.hypot(w.x - seg.b.x, w.y - seg.b.y));
                    if (minDist <= w.r2 && maxDist >= w.r1) seg.glow = 1.0;
                }
                seg.glow = Math.max(0, seg.glow - dt / 3);
            }

            for (let e of enemies) {
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    gameOver(false); return;
                }
            }

            if (Math.hypot(player.x - exit.x, player.y - exit.y) < player.radius + 15) {
                gameOver(true); return;
            }

            render();
        }

        window.addEventListener('keydown', e => {
            if (e.key === ' ') { e.preventDefault(); if (gameState === 'PLAYING') fireSonar(); }
            keys[e.key] = true;
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
        window.addEventListener('blur', () => { if (gameState === 'PLAYING') { gameState = 'PAUSED'; document.getElementById('pauseMenu').classList.remove('hidden'); } });
        window.addEventListener('resize', () => { if (gameState === 'PLAYING') { gameState = 'PAUSED'; document.getElementById('pauseMenu').classList.remove('hidden'); } });

        const jz = document.getElementById('joystickZone'), jk = document.getElementById('joystickKnob');
        jz.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (joy.active) return;
            let t = e.changedTouches[0];
            joy.id = t.identifier; joy.active = true; updateJoy(t);
        }, { passive: false });
        jz.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === joy.id) updateJoy(e.changedTouches[i]);
        }, { passive: false });
        function joyEnd(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joy.id) {
                    joy.active = false; joy.id = null; joy.nx = 0; joy.ny = 0;
                    jk.style.transform = `translate(0px, 0px)`;
                }
            }
        }
        jz.addEventListener('touchend', joyEnd); jz.addEventListener('touchcancel', joyEnd);
        function updateJoy(t) {
            let rect = jz.getBoundingClientRect();
            let dx = t.clientX - (rect.left + rect.width / 2);
            let dy = t.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy), max = rect.width / 2;
            if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
            jk.style.transform = `translate(${dx}px, ${dy}px)`;
            joy.nx = dx / max; joy.ny = dy / max;
        }

        document.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (!e.changedTouches[i].target.closest('#joystickZone')) fireSonar();
            }
        }, { passive: false });

        document.getElementById('btnStart').addEventListener('click', () => { Audio.init(); initGame(); });
        document.getElementById('btnResume').addEventListener('click', () => {
            Audio.init(); gameState = 'PLAYING';
            document.getElementById('pauseMenu').classList.add('hidden');
            lastTime = performance.now();
        });
        document.getElementById('btnRestart').addEventListener('click', () => { Audio.init(); initGame(); });

        requestAnimationFrame(loop);
    </script>
