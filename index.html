<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonar Maze</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 1000px;
            max-width: 100vw;
            aspect-ratio: 10 / 8;
            background: #050505;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
            margin-bottom: 20px;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            color: #ccc;
            margin: 5px 0;
            text-align: center;
            max-width: 80%;
        }

        .btn {
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px #0ff inset, 0 0 10px #0ff;
            transition: all 0.2s;
            margin-top: 30px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        #ui-bar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
            font-size: 28px;
            text-shadow: 0 0 10px #fff;
            z-index: 50;
            font-weight: bold;
        }

        #sonar-count {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        #joystick-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 10;
        }

        #sonar-area {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 10;
        }

        #joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: none;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) inset;
        }

        #joystick-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            top: 35px;
            left: 35px;
            box-shadow: 0 0 10px #0ff;
        }

        .title-red {
            color: #f00;
            text-shadow: 0 0 15px #f00;
        }

        .btn-red {
            border-color: #f00;
            color: #f00;
            box-shadow: 0 0 10px #f00 inset, 0 0 10px #f00;
            background: rgba(255, 0, 0, 0.1);
        }

        .btn-red:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 20px #f00;
        }

        .title-green {
            color: #0f0;
            text-shadow: 0 0 15px #0f0;
        }

        .btn-green {
            border-color: #0f0;
            color: #0f0;
            box-shadow: 0 0 10px #0f0 inset, 0 0 10px #0f0;
            background: rgba(0, 255, 0, 0.1);
        }

        .btn-green:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        <div id="ui-bar">
            <div>SONAR: <span id="sonar-count">5</span></div>
            <div style="font-size: 16px; margin-top: 8px; color: rgba(255,255,255,0.5);">FPS: <span
                    id="fps-counter">0</span></div>
        </div>

        <div id="menu" class="overlay active">
            <h1>SONAR MAZE</h1>
            <p>Zdi bludiště jsou skryty ve tmě.</p>
            <p>Pohyb: WASD / Šipky / Virtuální Joystick vlevo</p>
            <p>Sonar: Mezerník / Tap na pravou polovinu displeje</p>
            <p>Najdi zelený východ. Pozor na červené entity!</p>
            <button class="btn" id="start-btn">Start</button>
        </div>

        <div id="pause" class="overlay">
            <h1>PAUZA</h1>
            <button class="btn" id="resume-btn">Pokračovat</button>
        </div>

        <div id="gameover" class="overlay">
            <h1 class="title-red">GAME OVER</h1>
            <button class="btn btn-red" id="restart-btn">Hrát znovu</button>
        </div>

        <div id="victory" class="overlay">
            <h1 class="title-green">ÚTĚK ÚSPĚŠNÝ!</h1>
            <button class="btn btn-green" id="win-restart-btn">Hrát znovu</button>
        </div>

        <div id="joystick-area"></div>
        <div id="sonar-area"></div>
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const C = { W: 1000, H: 800, COLS: 25, ROWS: 20, CELL_W: 40, CELL_H: 40, SUBSTEPS: 4 };

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPing() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.9);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.9);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.9);
        }

        function playDeath() {
            if (!audioCtx) return;
            let osc1 = audioCtx.createOscillator();
            let osc2 = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc1.type = 'square'; osc2.type = 'sawtooth';
            osc1.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.6);
            osc2.frequency.setValueAtTime(90, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 0.6); osc2.stop(audioCtx.currentTime + 0.6);
        }

        function playWin() {
            if (!audioCtx) return;
            const freqs = [523, 659, 784, 1047];
            freqs.forEach((f, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = f;
                let t = audioCtx.currentTime + i * 0.15;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.5, t + 0.05);
                gain.gain.linearRampToValueAtTime(0, t + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.15);
            });
        }

        let state = 'menu';
        let player = { x: 0, y: 0, vx: 0, vy: 0, r: 10, pulses: 5, lastSonar: 0, speed: 1800, friction: 0.82 };
        let walls = [], enemies = [], sonars = [], particles = [], collectibles = [], footprints = [];
        let keys = { w: 0, a: 0, s: 0, d: 0 };
        let joy = { x: 0, y: 0, active: false };
        let joyId = null, joyStartX = 0, joyStartY = 0;

        function setOverlay(id) {
            document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
            if (id) document.getElementById(id).classList.add('active');
        }

        document.getElementById('start-btn').onclick = () => { initAudio(); startGame(); };
        document.getElementById('resume-btn').onclick = () => { state = 'playing'; setOverlay(null); lastTime = performance.now(); };
        document.getElementById('restart-btn').onclick = startGame;
        document.getElementById('win-restart-btn').onclick = startGame;

        window.addEventListener('keydown', e => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = 1;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = 1;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = 1;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = 1;
            if (e.key === ' ') { e.preventDefault(); triggerSonar(); }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = 0;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = 0;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = 0;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = 0;
        });

        const joyArea = document.getElementById('joystick-area');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');

        joyArea.addEventListener('touchstart', e => {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (joyId === null) {
                    joyId = t.identifier;
                    joyStartX = t.clientX; joyStartY = t.clientY;
                    let rect = joyArea.getBoundingClientRect();
                    joyBase.style.display = 'block';
                    joyBase.style.left = (t.clientX - rect.left - 60) + 'px';
                    joyBase.style.top = (t.clientY - rect.top - 60) + 'px';
                    joy.active = true;
                    updateJoy(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        joyArea.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === joyId) updateJoy(t.clientX, t.clientY);
            }
        }, { passive: false });

        const joyEnd = e => {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === joyId) {
                    joyId = null; joyBase.style.display = 'none';
                    joy.active = false; joy.x = 0; joy.y = 0;
                    joyStick.style.transform = `translate(0px, 0px)`;
                }
            }
        };
        joyArea.addEventListener('touchend', joyEnd, { passive: false });
        joyArea.addEventListener('touchcancel', joyEnd, { passive: false });

        function updateJoy(tx, ty) {
            let dx = tx - joyStartX;
            let dy = ty - joyStartY;
            let len = Math.sqrt(dx * dx + dy * dy);
            let maxR = 35;
            if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joy.x = dx / maxR; joy.y = dy / maxR;
        }

        document.getElementById('sonar-area').addEventListener('touchstart', e => {
            e.preventDefault();
            triggerSonar();
        }, { passive: false });

        window.addEventListener('resize', () => { if (state === 'playing') { state = 'pause'; setOverlay('pause'); } });
        window.addEventListener('blur', () => { if (state === 'playing') { state = 'pause'; setOverlay('pause'); } });

        function triggerSonar(superPing = false) {
            if (state !== 'playing') return;
            let now = performance.now();
            if (!superPing && now - player.lastSonar < 1000) return;
            if (!superPing && player.pulses <= 0) return;

            if (!superPing) {
                player.pulses--; player.lastSonar = now;
                updateUI(); playPing();
            }
            sonars.push({ id: performance.now() + Math.random(), x: player.x, y: player.y, r: 0, maxR: superPing ? 1500 : 400, speed: 800, super: superPing });
        }

        function updateUI() { document.getElementById('sonar-count').textContent = player.pulses; }

        function generateMaze() {
            let grid = [];
            for (let i = 0; i < C.COLS; i++) {
                grid[i] = [];
                for (let j = 0; j < C.ROWS; j++) {
                    grid[i][j] = { x: i, y: j, visited: false, walls: [true, true, true, true] };
                }
            }
            let stack = [], current = grid[0][0];
            current.visited = true;

            function getUnvisitedNeighbors(c) {
                let n = [], { x, y } = c;
                if (y > 0 && !grid[x][y - 1].visited) n.push({ c: grid[x][y - 1], dir: 0 });
                if (x < C.COLS - 1 && !grid[x + 1][y].visited) n.push({ c: grid[x + 1][y], dir: 1 });
                if (y < C.ROWS - 1 && !grid[x][y + 1].visited) n.push({ c: grid[x][y + 1], dir: 2 });
                if (x > 0 && !grid[x - 1][y].visited) n.push({ c: grid[x - 1][y], dir: 3 });
                return n;
            }

            while (true) {
                let neighbors = getUnvisitedNeighbors(current);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    stack.push(current);
                    current.walls[next.dir] = false;
                    next.c.walls[(next.dir + 2) % 4] = false;
                    current = next.c; current.visited = true;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }

            walls = [];
            let wallId = 0;
            function addWall(x1, y1, x2, y2) {
                walls.push({ id: wallId++, x1, y1, x2, y2, alpha: 0, hitBy: new Set(), baseX1: x1, baseY1: y1, baseX2: x2, baseY2: y2, moving: false, timer: 0, speed: 0, slowFade: false });
            }
            for (let i = 0; i < C.COLS; i++) {
                for (let j = 0; j < C.ROWS; j++) {
                    let px = i * C.CELL_W, py = j * C.CELL_H;
                    if (grid[i][j].walls[0]) addWall(px, py, px + C.CELL_W, py);
                    if (grid[i][j].walls[3]) addWall(px, py, px, py + C.CELL_H);
                    if (j === C.ROWS - 1 && grid[i][j].walls[2]) addWall(px, py + C.CELL_H, px + C.CELL_W, py + C.CELL_H);
                    if (i === C.COLS - 1 && grid[i][j].walls[1]) addWall(px + C.CELL_W, py, px + C.CELL_W, py + C.CELL_H);
                }
            }
            walls.forEach(w => {
                if (w.x1 === 0 && w.x2 === 0) return;
                if (w.y1 === 0 && w.y2 === 0) return;
                if (w.x1 === C.W && w.x2 === C.W) return;
                if (w.y1 === C.H && w.y2 === C.H) return;
                if (Math.random() < 0.1) { w.moving = true; w.timer = Math.random() * Math.PI * 2; w.speed = 1 + Math.random(); }
            });
        }

        function startGame() {
            state = 'playing'; setOverlay(null);
            player.x = C.CELL_W / 2; player.y = C.CELL_H / 2;
            player.vx = 0; player.vy = 0; player.pulses = 5; player.lastSonar = 0;
            sonars = []; particles = []; footprints = [];
            updateUI(); generateMaze();

            enemies = [];
            for (let i = 0; i < 3; i++) {
                let x = C.W - C.CELL_W / 2 - Math.random() * 200;
                let y = C.H - C.CELL_H / 2 - Math.random() * 200;
                let ang = Math.random() * Math.PI * 2;
                enemies.push({ x, y, vx: Math.cos(ang) * 110, vy: Math.sin(ang) * 110, r: 12, stunned: 0, glitch: 0, hitBy: new Set(), isEnemy: true });
            }

            collectibles = [];
            let availCells = [];
            for (let i = 2; i < C.COLS - 2; i++) {
                for (let j = 2; j < C.ROWS - 2; j++) availCells.push({ i, j });
            }
            availCells.sort(() => Math.random() - 0.5);
            for (let i = 0; i < 3; i++) {
                let cell = availCells[i];
                collectibles.push({ x: cell.i * C.CELL_W + C.CELL_W / 2, y: cell.j * C.CELL_H + C.CELL_H / 2, type: i === 2 ? 'super' : 'battery', alpha: 0, collected: false, hitBy: new Set() });
            }
            lastTime = performance.now();
        }

        function checkWallCol(ent, sdt) {
            for (let w of walls) {
                let l2 = (w.x2 - w.x1) ** 2 + (w.y2 - w.y1) ** 2;
                let t = 0;
                if (l2 > 0) {
                    t = ((ent.x - w.x1) * (w.x2 - w.x1) + (ent.y - w.y1) * (w.y2 - w.y1)) / l2;
                    t = Math.max(0, Math.min(1, t));
                }
                let qx = w.x1 + t * (w.x2 - w.x1), qy = w.y1 + t * (w.y2 - w.y1);
                let dx = ent.x - qx, dy = ent.y - qy;
                let dSq = dx * dx + dy * dy, rSq = ent.r * ent.r;

                if (dSq < rSq) {
                    let dist = Math.sqrt(dSq), nx, ny;
                    if (dist === 0) {
                        let wdx = w.x2 - w.x1, wdy = w.y2 - w.y1;
                        let len = Math.sqrt(wdx * wdx + wdy * wdy);
                        nx = -wdy / len; ny = wdx / len; dist = 0;
                    } else { nx = dx / dist; ny = dy / dist; }

                    let push = (ent.r - dist) + 0.1;
                    ent.x += nx * push; ent.y += ny * push;

                    if (ent.isEnemy) {
                        let dot = ent.vx * nx + ent.vy * ny;
                        ent.vx -= 2 * dot * nx; ent.vy -= 2 * dot * ny;
                        let spd = Math.sqrt(ent.vx ** 2 + ent.vy ** 2);
                        if (spd > 0) { ent.vx = (ent.vx / spd) * 110; ent.vy = (ent.vy / spd) * 110; }
                    }
                }
            }
        }

        function update(dt) {
            let ax = 0, ay = 0;
            if (joy.active) { ax = joy.x; ay = joy.y; }
            else {
                if (keys.w) ay -= 1; if (keys.s) ay += 1;
                if (keys.a) ax -= 1; if (keys.d) ax += 1;
                let len = Math.sqrt(ax * ax + ay * ay);
                if (len > 0) { ax /= len; ay /= len; }
            }

            player.vx += ax * player.speed * dt; player.vy += ay * player.speed * dt;
            player.vx *= player.friction; player.vy *= player.friction;

            let sdt = dt / C.SUBSTEPS;
            for (let i = 0; i < C.SUBSTEPS; i++) {
                player.x += player.vx * sdt; player.y += player.vy * sdt;
                checkWallCol(player, sdt);
                for (let e of enemies) {
                    if (e.stunned <= 0) { e.x += e.vx * sdt; e.y += e.vy * sdt; }
                    checkWallCol(e, sdt);
                }
            }

            player.x = Math.max(player.r, Math.min(C.W - player.r, player.x));
            player.y = Math.max(player.r, Math.min(C.H - player.r, player.y));

            walls.forEach(w => {
                if (w.moving) {
                    w.timer += dt * w.speed;
                    let dx = w.baseX2 - w.baseX1, dy = w.baseY2 - w.baseY1;
                    let len = Math.sqrt(dx * dx + dy * dy), shift = Math.sin(w.timer) * (len * 0.45);
                    let nx = dx / len, ny = dy / len;
                    w.x1 = w.baseX1 + nx * shift; w.y1 = w.baseY1 + ny * shift;
                    w.x2 = w.baseX2 + nx * shift; w.y2 = w.baseY2 + ny * shift;
                }
                if (w.alpha > 0) w.alpha = Math.max(0, w.alpha - dt * (w.slowFade ? 0.11 : 0.33));
            });

            for (let i = sonars.length - 1; i >= 0; i--) {
                let s = sonars[i];
                s.r += s.speed * dt;
                for (let w of walls) {
                    if (!w.hitBy.has(s.id)) {
                        let mx = (w.x1 + w.x2) / 2, my = (w.y1 + w.y2) / 2;
                        let dSq = (s.x - mx) ** 2 + (s.y - my) ** 2;
                        if (dSq < s.r * s.r) {
                            w.hitBy.add(s.id); w.alpha = 1; w.slowFade = s.super;
                            for (let p = 0; p < 2; p++) particles.push({ x: mx + (Math.random() - 0.5) * 10, y: my + (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100, life: 0.8, color: '#0ff' });
                        }
                    }
                }
                for (let e of enemies) {
                    let dSq = (s.x - e.x) ** 2 + (s.y - e.y) ** 2;
                    if (dSq < s.r * s.r && !e.hitBy.has(s.id)) {
                        e.hitBy.add(s.id); e.stunned = s.super ? 4 : 2; e.glitch = 0.5;
                    }
                }
                for (let c of collectibles) {
                    if (!c.collected && !c.hitBy.has(s.id)) {
                        let dSq = (s.x - c.x) ** 2 + (s.y - c.y) ** 2;
                        if (dSq < s.r * s.r) { c.hitBy.add(s.id); c.alpha = 1; }
                    }
                }
                if (s.r > s.maxR) sonars.splice(i, 1);
            }

            for (let c of collectibles) {
                if (!c.collected && c.alpha > 0) {
                    c.alpha = Math.max(0, c.alpha - dt * 0.33);
                    if ((player.x - c.x) ** 2 + (player.y - c.y) ** 2 < (player.r + 15) ** 2) {
                        c.collected = true;
                        if (c.type === 'battery') {
                            player.pulses += 3; updateUI();
                            for (let p = 0; p < 15; p++) particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 350, vy: (Math.random() - 0.5) * 350, life: 1.5, color: '#ff0', ui: true });
                        } else if (c.type === 'super') triggerSonar(true);
                    }
                }
            }

            for (let e of enemies) {
                if (e.stunned > 0) e.stunned -= dt;
                if (e.glitch > 0) e.glitch -= dt;
                if (e.stunned <= 0) {
                    if ((player.x - e.x) ** 2 + (player.y - e.y) ** 2 < (player.r + e.r - 3) ** 2) { state = 'gameover'; setOverlay('gameover'); playDeath(); }
                }
            }

            let exitX = C.W - C.CELL_W / 2, exitY = C.H - C.CELL_H / 2;
            if ((player.x - exitX) ** 2 + (player.y - exitY) ** 2 < (player.r + 15) ** 2) { state = 'victory'; setOverlay('victory'); playWin(); }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
                if (p.ui) {
                    let dx = 80 - p.x, dy = 30 - p.y, len = Math.sqrt(dx * dx + dy * dy);
                    if (len > 0) { p.vx += (dx / len) * 800 * dt; p.vy += (dy / len) * 800 * dt; }
                }
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (Math.random() < 0.1 && (Math.abs(player.vx) > 15 || Math.abs(player.vy) > 15)) footprints.push({ x: player.x, y: player.y, life: 10 });
            for (let i = footprints.length - 1; i >= 0; i--) { footprints[i].life -= dt; if (footprints[i].life <= 0) footprints.splice(i, 1); }
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, C.W, C.H);
            ctx.globalCompositeOperation = 'lighter';

            let exitX = C.W - C.CELL_W / 2, exitY = C.H - C.CELL_H / 2;
            ctx.shadowBlur = 20; ctx.shadowColor = '#0f0'; ctx.fillStyle = '#0f0';
            ctx.beginPath(); ctx.arc(exitX, exitY, 12 + Math.sin(performance.now() / 200) * 4, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            for (let f of footprints) { ctx.globalAlpha = Math.max(0, f.life / 10); ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill(); }
            ctx.globalAlpha = 1;

            let buckets = Array.from({ length: 10 }, () => []);
            for (let w of walls) { if (w.alpha > 0) buckets[Math.min(9, Math.floor(w.alpha * 10))].push(w); }
            ctx.lineWidth = 3; ctx.lineCap = 'round';
            for (let i = 0; i < 10; i++) {
                if (buckets[i].length > 0) {
                    ctx.beginPath();
                    for (let w of buckets[i]) { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); }
                    ctx.shadowBlur = 15; ctx.shadowColor = '#0ff';
                    ctx.strokeStyle = `rgba(0, 255, 255, ${(i + 1) / 10})`; ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;

            ctx.lineWidth = 2;
            for (let s of sonars) {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, 1 - s.r / s.maxR)})`; ctx.stroke();
            }

            ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let c of collectibles) {
                if (!c.collected && c.alpha > 0) {
                    ctx.globalAlpha = c.alpha; ctx.shadowBlur = 20; ctx.shadowColor = c.type === 'super' ? '#f0f' : '#ff0';
                    ctx.fillText(c.type === 'super' ? '📡' : '🔋', c.x, c.y);
                }
            }
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

            for (let p of particles) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); }

            for (let e of enemies) {
                ctx.save(); ctx.translate(e.x, e.y);
                if (e.glitch > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
                let isStunned = e.stunned > 0;
                ctx.shadowBlur = 15; ctx.shadowColor = isStunned ? '#00f' : '#f00';
                ctx.strokeStyle = isStunned ? '#0ff' : '#f00'; ctx.lineWidth = 2;

                ctx.beginPath(); let ang = Math.atan2(e.vy, e.vx); ctx.rotate(ang);
                ctx.moveTo(12, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.stroke();

                ctx.fillStyle = isStunned ? '#0ff' : '#f00';
                ctx.beginPath(); ctx.arc(2, 0, 3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 0;

            ctx.save(); ctx.translate(player.x, player.y);
            let moving = player.vx ** 2 + player.vy ** 2 > 20;
            if (moving) ctx.rotate(Math.atan2(player.vy, player.vx));
            ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,255,255,0.6)'; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(4, -4, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, 4, 2, 0, Math.PI * 2); ctx.fill();
            if (moving) {
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                let t = performance.now() / 120, leg1 = Math.sin(t) * 6, leg2 = Math.cos(t) * 6;
                ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-12 + leg1, 12); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-12 + leg2, -12); ctx.stroke();
            }
            ctx.restore(); ctx.globalCompositeOperation = 'source-over';
        }

        let lastTime = performance.now(), frames = 0, lastFpsTime = 0;
        function loop(time) {
            requestAnimationFrame(loop);
            let dt = (time - lastTime) / 1000; lastTime = time;
            if (dt > 0.1) dt = 0.1;
            frames++;
            if (time - lastFpsTime >= 1000) { document.getElementById('fps-counter').textContent = frames; frames = 0; lastFpsTime = time; }
            if (state === 'playing') update(dt);
            draw();
        }
        requestAnimationFrame(loop);
    </script>
</body>

</html>
