<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonar Maze</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        canvas {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #050505;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.05);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 60px;
            margin: 0 0 20px 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
        }

        #menu h1 {
            text-shadow: 0 0 20px #0ff;
            color: #fff;
        }

        #pause h1 {
            text-shadow: 0 0 20px #ff0;
        }

        #gameover h1 {
            text-shadow: 0 0 20px #f00;
        }

        #victory h1 {
            text-shadow: 0 0 20px #0f0;
        }

        p {
            font-size: 18px;
            margin: 5px 0;
            opacity: 0.8;
            text-align: center;
            max-width: 80%;
        }

        button {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 40px;
            font-size: 22px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 30px;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) inset, 0 0 15px rgba(0, 255, 255, 0.3);
            transition: all 0.2s ease;
            border-radius: 5px;
            font-weight: bold;
            pointer-events: auto;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff inset, 0 0 30px #0ff;
            transform: scale(1.05);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            text-shadow: 0 0 10px #0ff;
            font-weight: bold;
            z-index: 5;
        }

        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            touch-action: none;
            display: none;
            pointer-events: auto;
            z-index: 5;
        }

        #joystick-knob {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.5);
            top: 40px;
            left: 40px;
            pointer-events: none;
            box-shadow: 0 0 15px #0ff;
            transform: translate(0, 0);
        }

        @media (max-width: 768px) {
            #joystick-zone {
                display: block;
            }

            button {
                padding: 10px 20px;
                font-size: 18px;
            }

            h1 {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        <div id="ui-layer">
            <div id="hud">PULZY: <span id="pulse-count">5</span></div>
            <div id="menu" class="screen">
                <h1>SONAR MAZE</h1>
                <p>Najdi zelený východ. Zdi jsou neviditelné.</p>
                <p>Pohyb: WASD / Šipky / Dotyk. Sonar: Mezerník / Dotyk.</p>
                <button id="btn-start">Start</button>
            </div>
            <div id="pause" class="screen hidden">
                <h1>PAUZA</h1>
                <button id="btn-resume">Pokračovat</button>
            </div>
            <div id="gameover" class="screen hidden">
                <h1>ZEMŘEL JSI</h1>
                <p id="go-reason"></p>
                <button id="btn-restart-go">Hrát znovu</button>
            </div>
            <div id="victory" class="screen hidden">
                <h1>VÍTĚZSTVÍ</h1>
                <button id="btn-restart-v">Hrát znovu</button>
            </div>
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');

            let actx = null;
            let state = 'MENU';
            let lastTime = 0;
            let keys = {};
            let touchStick = { active: false, id: null };
            let jx = 0, jy = 0;

            let player = { x: 0, y: 0, vx: 0, vy: 0, lastFootX: 0, lastFootY: 0 };
            let walls = [];
            let enemies = [];
            let collectibles = [];
            let particles = [];
            let waves = [];
            let footprints = [];
            let exit = { x: 0, y: 0 };

            let pulses = 5;
            let lastPulseTime = 0;
            let noPulseTimer = 2.0;

            function initAudio() {
                if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
                if (actx.state === 'suspended') actx.resume();
            }

            function playPing(isSuper) {
                if (!actx) return;
                let osc = actx.createOscillator();
                let gain = actx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isSuper ? 1800 : 1400, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, actx.currentTime + 0.9);
                gain.gain.setValueAtTime(0.5, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.9);
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.start(); osc.stop(actx.currentTime + 1);
            }

            function playDeath() {
                if (!actx) return;
                let osc1 = actx.createOscillator(), osc2 = actx.createOscillator(), gain = actx.createGain();
                osc1.type = 'square'; osc2.type = 'sawtooth';
                osc1.frequency.setValueAtTime(150, actx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.6);
                osc2.frequency.setValueAtTime(90, actx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.4, actx.currentTime);
                gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
                osc1.connect(gain); osc2.connect(gain); gain.connect(actx.destination);
                osc1.start(); osc2.start();
                osc1.stop(actx.currentTime + 0.7); osc2.stop(actx.currentTime + 0.7);
            }

            function playWin() {
                if (!actx) return;
                let freqs = [523.25, 659.25, 783.99, 1046.50];
                let t = actx.currentTime;
                for (let i = 0; i < 4; i++) {
                    let osc = actx.createOscillator(), gain = actx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freqs[i];
                    gain.gain.setValueAtTime(0, t + i * 0.15);
                    gain.gain.linearRampToValueAtTime(0.3, t + i * 0.15 + 0.05);
                    gain.gain.linearRampToValueAtTime(0, t + i * 0.15 + 0.3);
                    osc.connect(gain); gain.connect(actx.destination);
                    osc.start(t + i * 0.15); osc.stop(t + i * 0.15 + 0.35);
                }
            }

            function createWall(x1, y1, x2, y2, moving) {
                return {
                    x1, y1, x2, y2, currentX2: x2, currentY2: y2,
                    type: moving ? 'moving' : 'static',
                    phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random(),
                    glow: 0, superGlow: false
                };
            }

            function generateMaze() {
                walls = []; collectibles = []; enemies = [];
                let cols = 25, rows = 20, w = 40;
                let grid = Array.from({ length: rows }, (_, r) =>
                    Array.from({ length: cols }, (_, c) => ({ c, r, visited: false, walls: [true, true, true, true] }))
                );
                let stack = [], current = grid[0][0];
                current.visited = true;
                let unvisitedCount = cols * rows - 1;

                while (unvisitedCount > 0) {
                    let neighbors = [];
                    let { c, r } = current;
                    if (r > 0 && !grid[r - 1][c].visited) neighbors.push({ cell: grid[r - 1][c], dir: 0 });
                    if (c < cols - 1 && !grid[r][c + 1].visited) neighbors.push({ cell: grid[r][c + 1], dir: 1 });
                    if (r < rows - 1 && !grid[r + 1][c].visited) neighbors.push({ cell: grid[r + 1][c], dir: 2 });
                    if (c > 0 && !grid[r][c - 1].visited) neighbors.push({ cell: grid[r][c - 1], dir: 3 });

                    if (neighbors.length > 0) {
                        let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                        stack.push(current);
                        current.walls[next.dir] = false;
                        next.cell.walls[(next.dir + 2) % 4] = false;
                        current = next.cell;
                        current.visited = true;
                        unvisitedCount--;
                    } else if (stack.length > 0) {
                        current = stack.pop();
                    }
                }

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let cell = grid[r][c], x = c * w, y = r * w;
                        let isMoving = () => Math.random() < 0.1;
                        if (cell.walls[0] && r === 0) walls.push(createWall(x, y, x + w, y, false));
                        if (cell.walls[1]) walls.push(createWall(x + w, y, x + w, y + w, c !== cols - 1 && isMoving()));
                        if (cell.walls[2]) walls.push(createWall(x, y + w, x + w, y + w, r !== rows - 1 && isMoving()));
                        if (cell.walls[3] && c === 0) walls.push(createWall(x, y, x, y + w, false));
                    }
                }

                player = { x: 20, y: 20, vx: 0, vy: 0, lastFootX: 20, lastFootY: 20 };
                exit = { x: cols * w - 20, y: rows * w - 20 };

                let spawnRandom = (count, callback, avoidStart) => {
                    for (let i = 0; i < count; i++) {
                        let c, r;
                        do {
                            c = Math.floor(Math.random() * cols);
                            r = Math.floor(Math.random() * rows);
                        } while ((avoidStart && c < 5 && r < 5) || (c === cols - 1 && r === rows - 1));
                        callback(c * w + 20, r * w + 20);
                    }
                };

                spawnRandom(5, (x, y) => collectibles.push({ x, y, type: 'battery', glow: 0, collected: false }), false);
                spawnRandom(2, (x, y) => collectibles.push({ x, y, type: 'super', glow: 0, collected: false }), false);
                spawnRandom(3, (x, y) => enemies.push({ x, y, vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100, stunned: 0 }), true);

                for (let e of enemies) {
                    let len = Math.hypot(e.vx, e.vy);
                    e.vx = (e.vx / len) * 80; e.vy = (e.vy / len) * 80;
                }
            }

            function circleLineCollide(circle, line) {
                let lx1 = line.x1, ly1 = line.y1;
                let lx2 = line.currentX2 !== undefined ? line.currentX2 : line.x2;
                let ly2 = line.currentY2 !== undefined ? line.currentY2 : line.y2;
                let dx = lx2 - lx1, dy = ly2 - ly1;
                let lenSq = dx * dx + dy * dy, t = 0;
                if (lenSq > 0) t = Math.max(0, Math.min(1, ((circle.x - lx1) * dx + (circle.y - ly1) * dy) / lenSq));
                let cx = lx1 + t * dx, cy = ly1 + t * dy;
                let dstSq = (circle.x - cx) * (circle.x - cx) + (circle.y - cy) * (circle.y - cy);
                if (dstSq < circle.r * circle.r) {
                    let dst = Math.sqrt(dstSq), nx, ny;
                    if (dst === 0) {
                        if (lenSq > 0) { nx = -dy / Math.sqrt(lenSq); ny = dx / Math.sqrt(lenSq); }
                        else { nx = 1; ny = 0; }
                        dst = 0.001;
                    } else { nx = (circle.x - cx) / dst; ny = (circle.y - cy) / dst; }
                    return { hit: true, nx, ny, pen: circle.r - dst, cx, cy };
                }
                return { hit: false };
            }

            function spawnSparks(x, y, nx, ny, count, color) {
                for (let i = 0; i < count; i++) {
                    let angle = Math.atan2(ny, nx) + (Math.random() - 0.5) * Math.PI;
                    let speed = 50 + Math.random() * 100;
                    particles.push({
                        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        life: 0.5 + Math.random() * 0.5, maxLife: 1.0, color: color || '#0ff', type: 'spark'
                    });
                }
            }

            function fireSonar(isSuper = false) {
                let now = performance.now();
                if (now - lastPulseTime < 1000 && !isSuper) return;
                if (pulses <= 0 && !isSuper) return;
                if (!isSuper) pulses--;
                document.getElementById('pulse-count').innerText = pulses;
                lastPulseTime = now;

                waves.push({
                    x: player.x, y: player.y, r: 10, speed: isSuper ? 800 : 600,
                    life: isSuper ? 3.0 : 1.5, maxLife: isSuper ? 3.0 : 1.5,
                    super: isSuper, hitWalls: new Set(), hitEnemies: new Set(), hitCols: new Set()
                });
                playPing(isSuper);
            }

            function updateWorld(dt, time) {
                for (let w of walls) {
                    if (w.type === 'moving') {
                        let osc = (Math.sin(time * w.speed + w.phase) + 1) / 2;
                        w.currentX2 = w.x1 + (w.x2 - w.x1) * osc;
                        w.currentY2 = w.y1 + (w.y2 - w.y1) * osc;
                    }
                    if (w.glow > 0) w.glow -= dt / (w.superGlow ? 9.0 : 3.0);
                }

                for (let e of enemies) {
                    if (e.stunned > 0) { e.stunned -= dt; }
                    else {
                        e.x += e.vx * dt; e.y += e.vy * dt;
                        for (let w of walls) {
                            let col = circleLineCollide({ x: e.x, y: e.y, r: 12 }, w);
                            if (col.hit) {
                                e.x += col.nx * (col.pen + 0.05); e.y += col.ny * (col.pen + 0.05);
                                let dot = e.vx * col.nx + e.vy * col.ny;
                                if (dot < 0) { e.vx -= 2 * dot * col.nx; e.vy -= 2 * dot * col.ny; }
                            }
                        }
                    }
                }

                for (let i = waves.length - 1; i >= 0; i--) {
                    let w = waves[i];
                    w.r += w.speed * dt; w.life -= dt;
                    if (w.life <= 0) { waves.splice(i, 1); continue; }

                    let waveMaxSq = w.r * w.r;
                    for (let wall of walls) {
                        if (!w.hitWalls.has(wall)) {
                            let lx1 = wall.x1, ly1 = wall.y1, lx2 = wall.currentX2 || wall.x2, ly2 = wall.currentY2 || wall.y2;
                            let dx = lx2 - lx1, dy = ly2 - ly1, lenSq = dx * dx + dy * dy, t = 0;
                            if (lenSq > 0) t = Math.max(0, Math.min(1, ((w.x - lx1) * dx + (w.y - ly1) * dy) / lenSq));
                            let cx = lx1 + t * dx, cy = ly1 + t * dy;
                            let dSq = (w.x - cx) ** 2 + (w.y - cy) ** 2;
                            if (dSq < waveMaxSq) {
                                w.hitWalls.add(wall);
                                wall.glow = 1.0; wall.superGlow = w.super || wall.superGlow;
                                let nx = 1, ny = 0;
                                if (dSq > 0) { let d = Math.sqrt(dSq); nx = (cx - w.x) / d; ny = (cy - w.y) / d; }
                                spawnSparks(cx, cy, -nx, -ny, 3, w.super ? '#f0f' : '#0ff');
                            }
                        }
                    }
                    for (let e of enemies) {
                        if (!w.hitEnemies.has(e) && (w.x - e.x) ** 2 + (w.y - e.y) ** 2 < waveMaxSq) {
                            w.hitEnemies.add(e); e.stunned = w.super ? 4.0 : 2.0;
                        }
                    }
                    for (let c of collectibles) {
                        if (!c.collected && !w.hitCols.has(c) && (w.x - c.x) ** 2 + (w.y - c.y) ** 2 < waveMaxSq) {
                            w.hitCols.add(c); c.glow = 1.0; c.superGlow = w.super;
                        }
                    }
                }

                for (let c of collectibles) if (c.glow > 0) c.glow -= dt / (c.superGlow ? 9.0 : 3.0);

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.life -= dt;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    if (p.type === 'ui_fly') {
                        let tx = canvas.width / 2, ty = 20, ang = Math.atan2(ty - p.y, tx - p.x);
                        p.vx += Math.cos(ang) * 1500 * dt; p.vy += Math.sin(ang) * 1500 * dt;
                        p.vx *= 0.95; p.vy *= 0.95;
                    }
                    p.x += p.vx * dt; p.y += p.vy * dt;
                }

                for (let i = footprints.length - 1; i >= 0; i--) {
                    footprints[i].life -= dt;
                    if (footprints[i].life <= 0) footprints.splice(i, 1);
                }
            }

            function updatePlayer(dt) {
                let ix = 0, iy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) iy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) iy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) ix += 1;

                if (touchStick.active) { ix = jx; iy = jy; }
                else { let len = Math.hypot(ix, iy); if (len > 0) { ix /= len; iy /= len; } }

                let accel = 1500, friction = 8;
                player.vx += ix * accel * dt; player.vy += iy * accel * dt;
                player.vx -= player.vx * friction * dt; player.vy -= player.vy * friction * dt;

                let steps = 4, sdt = dt / steps;
                for (let s = 0; s < steps; s++) {
                    player.x += player.vx * sdt; player.y += player.vy * sdt;
                    if (player.x < 10) player.x = 10; if (player.x > canvas.width - 10) player.x = canvas.width - 10;
                    if (player.y < 10) player.y = 10; if (player.y > canvas.height - 10) player.y = canvas.height - 10;

                    for (let w of walls) {
                        let col = circleLineCollide({ x: player.x, y: player.y, r: 10 }, w);
                        if (col.hit) {
                            player.x += col.nx * (col.pen + 0.05); player.y += col.ny * (col.pen + 0.05);
                            let dot = player.vx * col.nx + player.vy * col.ny;
                            if (dot < 0) { player.vx -= dot * col.nx; player.vy -= dot * col.ny; }
                        }
                    }
                }

                if (Math.hypot(player.x - player.lastFootX, player.y - player.lastFootY) > 15) {
                    footprints.push({ x: player.x, y: player.y, life: 5.0, maxLife: 5.0 });
                    player.lastFootX = player.x; player.lastFootY = player.y;
                }

                for (let c of collectibles) {
                    if (!c.collected && (player.x - c.x) ** 2 + (player.y - c.y) ** 2 < 625) {
                        c.collected = true;
                        if (c.type === 'battery') {
                            pulses += 3; document.getElementById('pulse-count').innerText = pulses;
                            for (let i = 0; i < 15; i++) particles.push({
                                x: c.x, y: c.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                                life: 1.5, maxLife: 1.5, color: '#ff0', type: 'ui_fly'
                            });
                        } else if (c.type === 'super') { fireSonar(true); }
                    }
                }

                if ((player.x - exit.x) ** 2 + (player.y - exit.y) ** 2 < 625) { winGame(); return; }

                for (let e of enemies) {
                    if ((player.x - e.x) ** 2 + (player.y - e.y) ** 2 < 484 && e.stunned <= 0) {
                        loseGame("Kontakt s entitou."); return;
                    }
                }

                if (pulses <= 0 && waves.length === 0) {
                    noPulseTimer -= dt;
                    if (noPulseTimer <= 0) { loseGame("Došly ti pulzy."); return; }
                } else { noPulseTimer = 2.0; }
            }

            function draw(time) {
                ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                let pulseE = (Math.sin(time * 4) + 1) / 2;
                ctx.fillStyle = `rgba(0, 255, 0, ${0.1 + pulseE * 0.2})`;
                ctx.beginPath(); ctx.arc(exit.x, exit.y, 30, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#0f0';
                ctx.beginPath(); ctx.arc(exit.x, exit.y, 12, 0, Math.PI * 2); ctx.fill();

                for (let f of footprints) {
                    ctx.fillStyle = `rgba(0, 255, 255, ${(f.life / f.maxLife) * 0.2})`;
                    ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI * 2); ctx.fill();
                }

                ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                for (let c of collectibles) {
                    if (!c.collected && c.glow > 0) {
                        ctx.globalAlpha = c.glow;
                        ctx.fillStyle = c.type === 'battery' ? 'rgba(255, 255, 0, 0.2)' : 'rgba(255, 0, 255, 0.2)';
                        ctx.beginPath(); ctx.arc(c.x, c.y, 25, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = Math.min(1, c.glow * 2);
                        ctx.fillText(c.type === 'battery' ? '🔋' : '📡', c.x, c.y);
                        ctx.globalAlpha = 1.0;
                    }
                }

                let buckets = Array.from({ length: 10 }, () => []);
                for (let w of walls) {
                    if (w.glow > 0.01) buckets[Math.min(9, Math.floor(w.glow * 10))].push(w);
                }

                ctx.lineCap = 'round';
                for (let i = 0; i < 10; i++) {
                    if (buckets[i].length === 0) continue;
                    let alpha = (i + 1) / 10;
                    ctx.beginPath();
                    for (let w of buckets[i]) {
                        ctx.moveTo(w.x1, w.y1);
                        ctx.lineTo(w.currentX2 !== undefined ? w.currentX2 : w.x2, w.currentY2 !== undefined ? w.currentY2 : w.y2);
                    }
                    ctx.strokeStyle = `rgba(0, 200, 255, ${alpha * 0.4})`; ctx.lineWidth = 6; ctx.stroke();
                    ctx.strokeStyle = `rgba(100, 255, 255, ${alpha})`; ctx.lineWidth = 2; ctx.stroke();
                }

                ctx.lineWidth = 2;
                for (let w of waves) {
                    ctx.strokeStyle = w.super ? `rgba(255, 0, 255, ${w.life / w.maxLife})` : `rgba(0, 255, 255, ${w.life / w.maxLife})`;
                    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
                }

                for (let e of enemies) {
                    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
                    if (e.stunned > 0) ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
                    ctx.beginPath(); ctx.arc(0, 0, 18 + Math.sin(time * 5) * 2, 0, Math.PI * 2);
                    ctx.fillStyle = e.stunned > 0 ? 'rgba(0, 100, 255, 0.2)' : 'rgba(255, 0, 0, 0.2)'; ctx.fill();
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        let a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
                        a += Math.PI / 6; ctx.lineTo(Math.cos(a) * 6, Math.sin(a) * 6);
                    }
                    ctx.closePath();
                    ctx.fillStyle = e.stunned > 0 ? '#08f' : '#f00'; ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = e.stunned > 0 ? '#fff' : '#ff0';
                    ctx.beginPath(); ctx.arc(2, 0, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                ctx.save(); ctx.translate(player.x, player.y);
                ctx.rotate((player.vx !== 0 || player.vy !== 0) ? Math.atan2(player.vy, player.vx) : 0);
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)'; ctx.fill();
                let legO = Math.sin(time * 15) * (Math.hypot(player.vx, player.vy) > 5 ? 5 : 0);
                ctx.fillStyle = '#08f'; ctx.fillRect(-5, -8 + legO, 10, 4); ctx.fillRect(-5, 4 - legO, 10, 4);
                ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#0ff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(4, -3, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, 3, 2, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                ctx.globalCompositeOperation = 'lighter';
                for (let p of particles) {
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife;
                    let s = p.type === 'ui_fly' ? 4 : 2;
                    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
                }
                ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
            }

            function loop(timestamp) {
                requestAnimationFrame(loop);
                if (!lastTime) { lastTime = timestamp; return; }
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (dt > 0.05) dt = 0.05;

                if (state !== 'PAUSED') updateWorld(dt, timestamp / 1000);
                if (state === 'PLAYING') updatePlayer(dt);
                draw(timestamp / 1000);
            }

            function setScreen(id) {
                document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
                if (id) document.getElementById(id).classList.remove('hidden');
            }

            function startGame() {
                initAudio(); generateMaze();
                pulses = 5; document.getElementById('pulse-count').innerText = pulses;
                particles = []; waves = []; footprints = []; keys = {};
                touchStick.active = false; jx = 0; jy = 0; joyKnob.style.transform = `translate(0px, 0px)`;
                state = 'PLAYING'; setScreen(null);
            }

            function loseGame(reason) {
                state = 'GAMEOVER'; document.getElementById('go-reason').innerText = reason || "";
                setScreen('gameover'); playDeath();
            }

            function winGame() { state = 'VICTORY'; setScreen('victory'); playWin(); }

            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-resume').addEventListener('click', () => { initAudio(); if (state === 'PAUSED') { state = 'PLAYING'; setScreen(null); } });
            document.getElementById('btn-restart-go').addEventListener('click', startGame);
            document.getElementById('btn-restart-v').addEventListener('click', startGame);

            window.addEventListener('blur', () => { if (state === 'PLAYING') { state = 'PAUSED'; setScreen('pause'); } });
            window.addEventListener('resize', () => { if (state === 'PLAYING') { state = 'PAUSED'; setScreen('pause'); } });

            document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (state === 'PLAYING') fireSonar(); } keys[e.code] = true; });
            document.addEventListener('keyup', e => keys[e.code] = false);

            window.addEventListener('touchstart', e => {
                if (e.target.closest('#joystick-zone') || e.target.closest('button')) return;
                if (state === 'PLAYING') { e.preventDefault(); fireSonar(); }
            }, { passive: false });

            window.addEventListener('mousedown', e => {
                if (e.target.closest('#joystick-zone') || e.target.closest('button')) return;
                if (state === 'PLAYING' && e.button === 0) fireSonar();
            });

            joyZone.addEventListener('touchstart', e => {
                e.preventDefault(); if (touchStick.active) return;
                touchStick.active = true; touchStick.id = e.changedTouches[0].identifier;
                updateJoy(e.changedTouches[0]);
            }, { passive: false });

            joyZone.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let t of e.changedTouches) if (t.identifier === touchStick.id) updateJoy(t);
            }, { passive: false });

            const endJoy = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchStick.id) {
                        touchStick.active = false; jx = 0; jy = 0;
                        joyKnob.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            joyZone.addEventListener('touchend', endJoy); joyZone.addEventListener('touchcancel', endJoy);

            function updateJoy(t) {
                let rect = joyZone.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                let dx = t.clientX - cx, dy = t.clientY - cy, len = Math.hypot(dx, dy), max = 40;
                if (len > max) { dx = (dx / len) * max; dy = (dy / len) * max; }
                jx = dx / max; jy = dy / max; joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            }

            requestAnimationFrame(loop);
        })();
    </script>
</body>

</html>
