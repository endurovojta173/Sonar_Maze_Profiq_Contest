<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sonar Maze</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
    color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
  #rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#000;z-index:50;text-align:center;padding:24px}
  #rotate .icon{width:54px;height:84px;border:2px solid #fff;border-radius:8px;opacity:.85;
    animation:tilt 2.2s ease-in-out infinite}
  @keyframes tilt{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #rotate p{margin:0;font-size:15px;letter-spacing:.06em;opacity:.8}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
  #hud{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:0;
    padding:0 10px;background:#050607;border-bottom:1px solid rgba(255,255,255,.09);
    font-size:12px;letter-spacing:.04em;overflow:hidden;white-space:nowrap}
  .stat{display:flex;align-items:baseline;gap:6px;padding:0 10px;flex:0 0 auto}
  .stat span.k{opacity:.42;font-size:10px;letter-spacing:.14em}
  .stat span.v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  #vLevel{color:#7fe9ff}#vPulse{color:#9fe5ff}#vBatt{color:#ffd85e}#vScore{color:#fff}#vTime{color:#cfcfcf}
  #hud .sp{flex:1 1 auto}
  #warn{color:#ff5b5b;font-weight:600;font-size:12px;padding-right:8px;display:none}
  #stage{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #c{display:block;max-width:100%;max-height:100%;aspect-ratio:5/4;background:#000;touch-action:none}
  #joy{display:none;position:absolute;left:16px;bottom:16px;width:132px;height:132px;
    border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03);
    z-index:6;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
    box-shadow:0 0 18px rgba(120,220,255,.35)}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.82);backdrop-filter:blur(3px);z-index:10;padding:16px;overflow:auto}
  #overlay.on{display:flex}
  .panel{width:min(680px,96%);background:rgba(8,10,12,.9);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:22px 24px;box-shadow:0 0 60px rgba(0,220,255,.09)}
  .panel h1{margin:0 0 4px;font-size:30px;font-weight:700;letter-spacing:.02em}
  .panel h1 em{font-style:normal;color:#38e8ff;text-shadow:0 0 16px rgba(56,232,255,.55)}
  .panel h2{margin:0 0 10px;font-size:22px;font-weight:600}
  .lead{margin:0 0 14px;font-size:13px;line-height:1.55;opacity:.72}
  .rules{margin:0 0 16px;padding:0;list-style:none;font-size:12.5px;line-height:1.75;opacity:.82}
  .rules li{padding-left:16px;position:relative}
  .rules li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
    background:#38e8ff;box-shadow:0 0 8px #38e8ff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 16px}
  .cell{border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 10px;background:rgba(255,255,255,.02)}
  .cell b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .cell i{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;opacity:.45;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
  th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.12em;opacity:.4;padding:0 8px 6px 0}
  td{padding:5px 8px 5px 0;border-top:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
  tr.me td{color:#38e8ff}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;font-weight:600;letter-spacing:.02em;color:#fff;cursor:pointer;
    padding:11px 22px;border-radius:9px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.05);transition:background .15s,border-color .15s,box-shadow .15s}
  button:hover{background:rgba(255,255,255,.11)}
  button:focus-visible{outline:2px solid #38e8ff;outline-offset:2px}
  button.primary{border-color:rgba(56,232,255,.6);background:rgba(56,232,255,.12);
    box-shadow:0 0 22px rgba(56,232,255,.18)}
  button.primary:hover{background:rgba(56,232,255,.22)}
  button.ghost{opacity:.6}
  .hint{margin:14px 0 0;font-size:11px;opacity:.4}
  @media (orientation:portrait) and (hover:none){#app{display:none}#rotate{display:flex}}
  @media (max-height:430px){.panel{padding:14px 16px}.panel h1{font-size:22px}.rules{line-height:1.5}}
  @media (prefers-reduced-motion:reduce){#rotate .icon{animation:none}}
</style>
</head>
<body>
<div id="rotate"><div class="icon"></div><p>Turn your device sideways to play</p></div>

<div id="app">
  <div id="hud">
    <div class="stat"><span class="k">LEVEL</span><span class="v" id="vLevel">1</span></div>
    <div class="stat"><span class="k">PULSES</span><span class="v" id="vPulse">7</span></div>
    <div class="stat"><span class="k">BATTERIES</span><span class="v" id="vBatt">0</span></div>
    <div class="sp"></div>
    <div id="warn"></div>
    <div class="stat"><span class="k">SCORE</span><span class="v" id="vScore">0</span></div>
    <div class="stat"><span class="k">TIME</span><span class="v" id="vTime">0:00.0</span></div>
  </div>
  <div id="stage">
    <canvas id="c" width="1000" height="800"></canvas>
    <div id="joy"><div id="knob"></div></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var W=1000,H=800,COLS=20,ROWS=15,CW=W/COLS,CH=H/ROWS;
var STEP=1/30;
var PLAYER_R=12,ENEMY_R=14,PLAYER_SPEED=195;
var PING_CD=1000,START_PULSES=7,LEVEL_PULSES=5,BATTERY_PULSES=3;
var LEVELS=[
 {name:"Cyan",  enemies:4, wall:"#00e5ff", accent:"#8ef7ff"},
 {name:"Purple",enemies:6, wall:"#b14bff", accent:"#e0b3ff"},
 {name:"Green", enemies:8, wall:"#39ff88", accent:"#b6ffd6"},
 {name:"Gold",  enemies:10,wall:"#ffc93c", accent:"#ffe8a8"},
 {name:"Orange",enemies:12,wall:"#ff7a1a", accent:"#ffc39a"}
];
var SIGNAL_GRACE=12;

/* ---------- dom ---------- */
var cv=document.getElementById("c"),ctx=cv.getContext("2d",{alpha:false});
var stage=document.getElementById("stage"),overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
var joy=document.getElementById("joy"),knob=document.getElementById("knob"),warnEl=document.getElementById("warn");
var vLevel=document.getElementById("vLevel"),vPulse=document.getElementById("vPulse"),
    vBatt=document.getElementById("vBatt"),vScore=document.getElementById("vScore"),vTime=document.getElementById("vTime");

/* ---------- audio ---------- */
var Audio_={
  ac:null,master:null,amb:null,ambGain:null,noteAt:0,level:1,ready:false,
  init:function(){
    if(this.ac)return;
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    this.ac=new AC();
    this.master=this.ac.createGain(); this.master.gain.value=0.55; this.master.connect(this.ac.destination);
    this.ready=true;
  },
  resume:function(){ if(this.ac&&this.ac.state==="suspended") this.ac.resume(); },
  startAmbient:function(lvl){
    if(!this.ready)return; this.stopAmbient(); this.level=lvl;
    var ac=this.ac,g=ac.createGain(); g.gain.value=0.0001;
    g.gain.linearRampToValueAtTime(0.20+lvl*0.012,ac.currentTime+2.5);
    var f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=280; f.Q.value=2;
    g.connect(f); f.connect(this.master);
    var a=ac.createOscillator(); a.type="sine"; a.frequency.value=41+lvl*1.5;
    var b=ac.createOscillator(); b.type="triangle"; b.frequency.value=58+lvl*2.2;
    var lfo=ac.createOscillator(); lfo.type="sine"; lfo.frequency.value=0.07+lvl*0.02;
    var lg=ac.createGain(); lg.gain.value=5; lfo.connect(lg); lg.connect(b.frequency);
    a.connect(g); b.connect(g); a.start(); b.start(); lfo.start();
    this.amb=[a,b,lfo]; this.ambGain=g; this.noteAt=0;
  },
  stopAmbient:function(){
    if(!this.amb)return; var ac=this.ac,g=this.ambGain,l=this.amb;
    try{ g.gain.cancelScheduledValues(ac.currentTime);
      g.gain.setValueAtTime(g.gain.value,ac.currentTime);
      g.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.5);
      for(var i=0;i<l.length;i++) l[i].stop(ac.currentTime+0.6);
    }catch(e){}
    this.amb=null; this.ambGain=null;
  },
  tick:function(t,lvl){
    if(!this.ready||!this.amb)return;
    if(t<this.noteAt)return;
    this.noteAt=t+(3.6-lvl*0.45)+Math.random()*(3.2-lvl*0.35);
    var scale=[130.8,146.8,155.6,174.6,196.0,207.7,233.1,261.6,311.1];
    this.note(scale[(Math.random()*scale.length)|0],1.4+Math.random()*1.6,0.055+lvl*0.006);
  },
  note:function(f,dur,vol){
    if(!this.ready)return; var ac=this.ac,o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
    o.type="sine"; o.frequency.value=f; fl.type="lowpass"; fl.frequency.value=700;
    g.gain.setValueAtTime(0.0001,ac.currentTime);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+dur*0.35);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.connect(fl); fl.connect(g); g.connect(this.master); o.start(); o.stop(ac.currentTime+dur+0.05);
  },
  ping:function(strong){
    if(!this.ready)return; var ac=this.ac,t=ac.currentTime,d=strong?1.4:0.9;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type="sine"; o.frequency.setValueAtTime(strong?1800:1400,t);
    o.frequency.exponentialRampToValueAtTime(180,t+d);
    g.gain.setValueAtTime(strong?0.34:0.24,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+0.05);
  },
  blip:function(f,vol){
    if(!this.ready)return; var ac=this.ac,t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.2,t+0.14);
    g.gain.setValueAtTime(vol||0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.25);
  },
  stun:function(){
    if(!this.ready)return; var ac=this.ac,t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type="square"; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(120,t+0.18);
    g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.22);
  },
  death:function(){
    if(!this.ready)return; var ac=this.ac,t=ac.currentTime,d=0.6;
    var s1=ac.createOscillator(),s2=ac.createOscillator(),g=ac.createGain();
    s1.type="square"; s2.type="sawtooth";
    s1.frequency.setValueAtTime(150,t); s1.frequency.exponentialRampToValueAtTime(30,t+d);
    s2.frequency.setValueAtTime(90,t);  s2.frequency.exponentialRampToValueAtTime(30,t+d);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s1.connect(g); s2.connect(g); g.connect(this.master);
    s1.start(t); s2.start(t); s1.stop(t+d+0.05); s2.stop(t+d+0.05);
  },
  victory:function(){
    if(!this.ready)return; var ac=this.ac,f=[523,659,784,1047];
    for(var i=0;i<4;i++){
      var t=ac.currentTime+i*0.16,o=ac.createOscillator(),g=ac.createGain();
      o.type="sine"; o.frequency.value=f[i];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.25,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.6);
    }
  }
};

/* ---------- math helpers ---------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function closestOnSeg(px,py,x1,y1,x2,y2,out){
  var ex=x2-x1,ey=y2-y1,l2=ex*ex+ey*ey,t=0;
  if(l2>0){ t=((px-x1)*ex+(py-y1)*ey)/l2; t=t<0?0:(t>1?1:t); }
  out.x=x1+ex*t; out.y=y1+ey*t; return out;
}
var _cp={x:0,y:0},_cp2={x:0,y:0};

/* ---------- game state ---------- */
var state="menu";
var cells,walls,wallGrid,wStamp,stampId=0,nearBuf=[];
var doorClock=0;
var player,enemies,items,exitCell,exitX,exitY;
var waves,particles,prints,glitches;
var level,pulses,batteries,startTime,elapsed,score,lastPing,lowSignal;
var deathCause="";
var flash=0;
var camX=0,camY=0,zoom=1;
var keys=Object.create(null);
var joyActive=false,joyId=null,joyBaseX=0,joyBaseY=0,joyDX=0,joyDY=0;
var isTouch=("ontouchstart" in window)||(navigator.maxTouchPoints>0);
var hudTick=0;

/* ---------- maze generation ---------- */
function genMaze(){
  var g=[],x,y;
  for(y=0;y<ROWS;y++){ var row=[]; for(x=0;x<COLS;x++) row.push({v:false,n:true,w:true,e:true,s:true}); g.push(row); }
  var stack=[[0,0]]; g[0][0].v=true;
  while(stack.length){
    var c=stack[stack.length-1]; x=c[0]; y=c[1];
    var nb=[];
    if(y>0&&!g[y-1][x].v) nb.push([x,y-1,"n","s"]);
    if(y<ROWS-1&&!g[y+1][x].v) nb.push([x,y+1,"s","n"]);
    if(x>0&&!g[y][x-1].v) nb.push([x-1,y,"w","e"]);
    if(x<COLS-1&&!g[y][x+1].v) nb.push([x+1,y,"e","w"]);
    if(!nb.length){ stack.pop(); continue; }
    var p=nb[(Math.random()*nb.length)|0];
    g[y][x][p[2]]=false; g[p[1]][p[0]][p[3]]=false; g[p[1]][p[0]].v=true;
    stack.push([p[0],p[1]]);
  }
  for(var i=0;i<26;i++){
    x=1+((Math.random()*(COLS-2))|0); y=1+((Math.random()*(ROWS-2))|0);
    if(Math.random()<0.5){ g[y][x].n=false; g[y-1][x].s=false; }
    else { g[y][x].w=false; g[y][x-1].e=false; }
  }
  return g;
}

function mkWall(x1,y1,x2,y2,door){
  return {x1:x1,y1:y1,x2:x2,y2:y2,door:!!door,glow:0,fade:1/3,
    phase:Math.random(),period:4.2+Math.random()*2.6,c:1,len:Math.hypot(x2-x1,y2-y1)};
}

function buildWalls(g){
  walls=[]; var x,y,passes=[];
  for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++){
    var c=g[y][x];
    if(c.n) walls.push(mkWall(x*CW,y*CH,(x+1)*CW,y*CH,false));
    else if(y>0) passes.push([x*CW,y*CH,(x+1)*CW,y*CH,x,y]);
    if(c.w) walls.push(mkWall(x*CW,y*CH,x*CW,(y+1)*CH,false));
    else if(x>0) passes.push([x*CW,y*CH,x*CW,(y+1)*CH,x,y]);
    if(x===COLS-1&&c.e) walls.push(mkWall(W,y*CH,W,(y+1)*CH,false));
    if(y===ROWS-1&&c.s) walls.push(mkWall(x*CW,H,(x+1)*CW,H,false));
  }
  for(var i=passes.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0,t=passes[i]; passes[i]=passes[j]; passes[j]=t; }
  var doors=Math.min(passes.length,8+level);
  for(var k=0;k<doors;k++){
    var p=passes[k];
    if(p[4]<2&&p[5]<2) continue;
    if(p[4]>COLS-3&&p[5]>ROWS-3) continue;
    walls.push(mkWall(p[0],p[1],p[2],p[3],true));
  }
  // spatial hash
  wallGrid=new Array(COLS*ROWS); for(var q=0;q<wallGrid.length;q++) wallGrid[q]=[];
  wStamp=new Int32Array(walls.length); stampId=0;
  for(var w=0;w<walls.length;w++){
    var wl=walls[w],gx,gy;
    if(wl.y1===wl.y2){
      gx=Math.floor((wl.x1+wl.x2)/2/CW); gy=Math.round(wl.y1/CH);
      addToGrid(gx,gy-1,w); addToGrid(gx,gy,w);
    } else {
      gy=Math.floor((wl.y1+wl.y2)/2/CH); gx=Math.round(wl.x1/CW);
      addToGrid(gx-1,gy,w); addToGrid(gx,gy,w);
    }
  }
}
function addToGrid(x,y,i){
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  wallGrid[y*COLS+x].push(i);
}
function nearWalls(x,y){
  stampId++; nearBuf.length=0;
  var cx=Math.floor(x/CW),cy=Math.floor(y/CH),i,j,k,arr;
  for(j=cy-1;j<=cy+1;j++){
    if(j<0||j>=ROWS)continue;
    for(i=cx-1;i<=cx+1;i++){
      if(i<0||i>=COLS)continue;
      arr=wallGrid[j*COLS+i];
      for(k=0;k<arr.length;k++){ var wi=arr[k]; if(wStamp[wi]!==stampId){ wStamp[wi]=stampId; nearBuf.push(wi); } }
    }
  }
  return nearBuf;
}

/* door geometry: returns count of active sub-segments written into segBuf */
var segBuf=[0,0,0,0,0,0,0,0];
function wallSegments(w){
  if(!w.door){ segBuf[0]=w.x1;segBuf[1]=w.y1;segBuf[2]=w.x2;segBuf[3]=w.y2; return 1; }
  var c=w.c; if(c<0.04) return 0;
  var hx=(w.x2-w.x1)*0.5*c, hy=(w.y2-w.y1)*0.5*c;
  segBuf[0]=w.x1;segBuf[1]=w.y1;segBuf[2]=w.x1+hx;segBuf[3]=w.y1+hy;
  segBuf[4]=w.x2;segBuf[5]=w.y2;segBuf[6]=w.x2-hx;segBuf[7]=w.y2-hy;
  return 2;
}

/* ---------- collision ---------- */
var hitN={x:0,y:0,hit:false};
function resolveCircle(o,r){
  hitN.hit=false;
  var list=nearWalls(o.x,o.y),i,k,n,ax,ay,bx,by;
  for(i=0;i<list.length;i++){
    var w=walls[list[i]];
    n=wallSegments(w);
    for(k=0;k<n;k++){
      ax=segBuf[k*4];ay=segBuf[k*4+1];bx=segBuf[k*4+2];by=segBuf[k*4+3];
      closestOnSeg(o.x,o.y,ax,ay,bx,by,_cp);
      var dx=o.x-_cp.x,dy=o.y-_cp.y,d2=dx*dx+dy*dy;
      if(d2<r*r){
        var d=Math.sqrt(d2),nx,ny;
        if(d<1e-6){
          var ex=bx-ax,ey=by-ay,el=Math.sqrt(ex*ex+ey*ey)||1;
          nx=-ey/el; ny=ex/el;
          if(o.px!==undefined){ var sx=o.px-_cp.x,sy=o.py-_cp.y; if(nx*sx+ny*sy<0){nx=-nx;ny=-ny;} }
          d=0;
        } else { nx=dx/d; ny=dy/d; }
        var push=r-d+0.05;
        o.x+=nx*push; o.y+=ny*push;
        hitN.hit=true; hitN.x=nx; hitN.y=ny;
      }
    }
  }
  if(o.x<r)o.x=r; if(o.y<r)o.y=r; if(o.x>W-r)o.x=W-r; if(o.y>H-r)o.y=H-r;
  return hitN.hit;
}

/* ---------- entities ---------- */
function cellCenter(cx,cy){ return {x:cx*CW+CW/2,y:cy*CH+CH/2}; }

function spawnLevel(){
  cells=genMaze();
  buildWalls(cells);
  doorClock=0;
  updateDoors(0);

  var s=cellCenter(0,0);
  player={x:s.x,y:s.y,px:s.x,py:s.y,r:PLAYER_R,face:1,walk:0,moving:false,bob:0};

  exitCell=[COLS-1,ROWS-1];
  var e=cellCenter(exitCell[0],exitCell[1]); exitX=e.x; exitY=e.y;

  enemies=[]; items=[]; waves=[]; particles=[]; prints=[]; glitches=[];
  var cfg=LEVELS[level-1],n=cfg.enemies,moving=Math.ceil(n*0.6);
  var used={};
  used[0]=true; used[(ROWS-1)*COLS+(COLS-1)]=true;
  var tries=0,made=0;
  while(made<n&&tries<800){
    tries++;
    var cx=(Math.random()*COLS)|0, cy=(Math.random()*ROWS)|0, key=cy*COLS+cx;
    if(used[key])continue;
    if(cx+cy<5)continue;
    used[key]=true;
    var p=cellCenter(cx,cy),mv=made<moving;
    var ang=Math.random()*Math.PI*2,sp=62+level*11;
    enemies.push({x:p.x,y:p.y,px:p.x,py:p.y,r:ENEMY_R,
      vx:mv?Math.cos(ang)*sp:0, vy:mv?Math.sin(ang)*sp:0, speed:sp, mover:mv,
      stun:0, hitWave:-1, t:Math.random()*10, blink:Math.random()*4+2});
    made++;
  }
  var nb=3+((Math.random()*2)|0), ns=(level>=2?1:0)+(Math.random()<0.4?1:0);
  placeItems("battery",nb,used);
  placeItems("super",ns,used);
}
function placeItems(kind,count,used){
  var made=0,tries=0;
  while(made<count&&tries<500){
    tries++;
    var cx=(Math.random()*COLS)|0, cy=(Math.random()*ROWS)|0, key=cy*COLS+cx;
    if(used[key])continue; if(cx+cy<3)continue;
    used[key]=true;
    var p=cellCenter(cx,cy);
    items.push({x:p.x,y:p.y,kind:kind,r:15,lit:0,taken:false,t:Math.random()*6,hitWave:-1});
    made++;
  }
}

/* ---------- waves ---------- */
var waveId=0;
function createWave(x,y,strong){
  var w={x:x,y:y,r:0,max:strong?1550:470,speed:strong?1150:440,strong:!!strong,
    id:++waveId,list:[],idx:0,alpha:1};
  var arr=new Array(walls.length);
  for(var i=0;i<walls.length;i++){
    var wl=walls[i];
    closestOnSeg(x,y,wl.x1,wl.y1,wl.x2,wl.y2,_cp2);
    var dx=_cp2.x-x,dy=_cp2.y-y;
    arr[i]={i:i,d2:dx*dx+dy*dy,cx:_cp2.x,cy:_cp2.y};
  }
  arr.sort(function(a,b){return a.d2-b.d2;});
  w.list=arr; waves.push(w);
  if(waves.length>6) waves.shift();
  return w;
}
function tryPing(){
  if(state!=="playing")return;
  var now=performance.now();
  if(now-lastPing<PING_CD)return;
  if(pulses<=0)return;
  pulses--; lastPing=now;
  Audio_.ping(false);
  createWave(player.x,player.y,false);
  if(pulses===0&&lowSignal<0) lowSignal=SIGNAL_GRACE;
}
function superPing(x,y){
  createWave(x,y,true);
  Audio_.ping(true);
}

/* ---------- particles ---------- */
function spark(x,y,nx,ny,color){
  if(particles.length>360)return;
  for(var i=0;i<3;i++){
    var a=Math.atan2(ny,nx)+(Math.random()-0.5)*1.9,s=45+Math.random()*95;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-15,
      life:0.5+Math.random()*0.45,max:0.95,c:color,s:1.6,g:190,seek:false});
  }
}
function burst(x,y,color,count){
  for(var i=0;i<count;i++){
    if(particles.length>420)break;
    var a=Math.random()*Math.PI*2,s=30+Math.random()*80;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1.4,max:1.4,c:color,s:2.2,g:0,seek:true,delay:0.18+Math.random()*0.25});
  }
}
function glitch(x,y){
  glitches.push({x:x,y:y,t:0.45,max:0.45});
  for(var i=0;i<6;i++){
    if(particles.length>420)break;
    particles.push({x:x+(Math.random()-0.5)*22,y:y+(Math.random()-0.5)*22,
      vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*70,
      life:0.3,max:0.3,c:"#9ff",s:1.4,g:0,seek:false});
  }
}

/* ---------- update ---------- */
function updateDoors(dt){
  doorClock+=dt;
  for(var i=0;i<walls.length;i++){
    var w=walls[i]; if(!w.door)continue;
    var v=0.5-0.5*Math.cos((doorClock/w.period+w.phase)*Math.PI*2);
    w.c=v<0.06?0:(v>0.94?1:v);
  }
}

function inputVector(out){
  var dx=0,dy=0;
  if(keys["KeyA"]||keys["ArrowLeft"])dx-=1;
  if(keys["KeyD"]||keys["ArrowRight"])dx+=1;
  if(keys["KeyW"]||keys["ArrowUp"])dy-=1;
  if(keys["KeyS"]||keys["ArrowDown"])dy+=1;
  if(joyActive){ dx+=joyDX; dy+=joyDY; }
  var m=Math.sqrt(dx*dx+dy*dy);
  if(m>1){ dx/=m; dy/=m; } 
  out.x=dx; out.y=dy; out.m=Math.min(1,m);
  return out;
}
var _iv={x:0,y:0,m:0};

function update(dt){
  elapsed+=dt;
  updateDoors(dt);
  Audio_.tick(Audio_.ac?Audio_.ac.currentTime:0,level);

  /* player */
  inputVector(_iv);
  player.px=player.x; player.py=player.y;
  var moving=_iv.m>0.05;
  player.moving=moving;
  if(moving){
    if(Math.abs(_iv.x)>0.15) player.face=_iv.x>0?1:-1;
    var SUB=5,sx=_iv.x*PLAYER_SPEED*dt/SUB,sy=_iv.y*PLAYER_SPEED*dt/SUB;
    for(var s=0;s<SUB;s++){
      player.x+=sx; player.y+=sy;
      resolveCircle(player,player.r);
    }
    player.walk+=dt*_iv.m*9.5;
    player.footT=(player.footT||0)+dt;
    if(player.footT>0.19){
      player.footT=0;
      if(prints.length<70) prints.push({x:player.x,y:player.y+9,t:5,max:5,f:player.face});
    }
  } else {
    resolveCircle(player,player.r);
  }
  player.bob+=dt*2.2;

  /* prints */
  for(var i=prints.length-1;i>=0;i--){ prints[i].t-=dt; if(prints[i].t<=0) prints.splice(i,1); }

  /* enemies */
  for(i=0;i<enemies.length;i++){
    var e=enemies[i]; e.t+=dt;
    if(e.stun>0){ e.stun-=dt; if(e.stun<0)e.stun=0; }
    else if(e.mover){
      var SUB2=4;
      for(var k=0;k<SUB2;k++){
        e.px=e.x; e.py=e.y;
        e.x+=e.vx*dt/SUB2; e.y+=e.vy*dt/SUB2;
        if(resolveCircle(e,e.r)){
          var d=e.vx*hitN.x+e.vy*hitN.y;
          e.vx-=2*d*hitN.x; e.vy-=2*d*hitN.y;
          var mag=Math.sqrt(e.vx*e.vx+e.vy*e.vy)||1;
          e.vx=e.vx/mag*e.speed; e.vy=e.vy/mag*e.speed;
        }
      }
      if(Math.random()<dt*0.25){
        var a=Math.atan2(e.vy,e.vx)+(Math.random()-0.5)*1.2;
        e.vx=Math.cos(a)*e.speed; e.vy=Math.sin(a)*e.speed;
      }
    }
    if(e.stun<=0){
      var ddx=e.x-player.x,ddy=e.y-player.y,rr=(e.r+player.r-3);
      if(ddx*ddx+ddy*ddy<rr*rr){ die("Caught by a hunter"); return; }
    }
  }

  /* waves */
  for(i=waves.length-1;i>=0;i--){
    var w=waves[i];
    w.r+=w.speed*dt;
    var r2=w.r*w.r,fade=w.strong?1/9:1/3,col=LEVELS[level-1].wall;
    while(w.idx<w.list.length&&w.list[w.idx].d2<=r2){
      var rec=w.list[w.idx++], wl=walls[rec.i];
      wl.glow=1; wl.fade=fade;
      if(Math.random()<(w.strong?0.10:0.30)){
        var nx=rec.cx-w.x,ny=rec.cy-w.y,nl=Math.sqrt(nx*nx+ny*ny)||1;
        spark(rec.cx,rec.cy,-nx/nl,-ny/nl,wl.door?"#ff9ad5":col);
      }
    }
    for(var q=0;q<enemies.length;q++){
      var en=enemies[q];
      if(en.hitWave===w.id)continue;
      var edx=en.x-w.x,edy=en.y-w.y;
      if(edx*edx+edy*edy<=r2){
        en.hitWave=w.id;
        en.stun=Math.max(en.stun,w.strong?5:2);
        glitch(en.x,en.y); Audio_.stun();
      }
    }
    for(q=items.length-1;q>=0;q--){
      var it=items[q];
      if(it.hitWave===w.id)continue;
      var idx2=it.x-w.x,idy2=it.y-w.y;
      if(idx2*idx2+idy2*idy2<=r2){ it.hitWave=w.id; it.lit=1; }
    }
    w.alpha=1-w.r/w.max;
    if(w.r>=w.max) waves.splice(i,1);
  }

  /* wall fade */
  for(i=0;i<walls.length;i++){
    var ww=walls[i];
    if(ww.glow>0){ ww.glow-=ww.fade*dt; if(ww.glow<0)ww.glow=0; }
  }

  /* items */
  for(i=items.length-1;i>=0;i--){
    var item=items[i]; item.t+=dt;
    if(item.lit>0){ item.lit-=dt/4.5; if(item.lit<0)item.lit=0; }
    var pdx=item.x-player.x,pdy=item.y-player.y,pr=item.r+player.r;
    if(pdx*pdx+pdy*pdy<pr*pr){
      items.splice(i,1);
      if(item.kind==="battery"){
        pulses+=BATTERY_PULSES; batteries++;
        if(pulses>0) lowSignal=-1;
        burst(item.x,item.y,"#ffd85e",14);
        Audio_.blip(560,0.18);
      } else {
        burst(item.x,item.y,"#c98bff",16);
        superPing(player.x,player.y);
      }
    }
  }

  /* particles */
  var uiTx=camX+(W/zoom)*0.5,uiTy=camY+14;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    if(p.seek){
      if(p.delay>0){ p.delay-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; }
      else {
        var tx=uiTx-p.x,ty=uiTy-p.y,tl=Math.sqrt(tx*tx+ty*ty)||1;
        p.vx+=tx/tl*1500*dt; p.vy+=ty/tl*1500*dt;
        p.vx*=0.94; p.vy*=0.94;
        p.x+=p.vx*dt; p.y+=p.vy*dt;
      }
    } else {
      p.vy+=p.g*dt; p.vx*=0.97; p.vy*=0.97;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
  }
  for(i=glitches.length-1;i>=0;i--){ glitches[i].t-=dt; if(glitches[i].t<=0) glitches.splice(i,1); }

  /* exit */
  var xdx=player.x-exitX,xdy=player.y-exitY;
  if(xdx*xdx+xdy*xdy<26*26) nextLevel();

  /* low signal */
  if(lowSignal>0){
    lowSignal-=dt;
    if(lowSignal<=0){ die("Signal lost"); return; }
  }
  if(flash>0) flash-=dt*2;
}

/* ---------- flow ---------- */
function computeScore(){
  var timeBonus=Math.max(0,6000-Math.floor(elapsed)*18);
  return Math.max(0,Math.round((level-1)*1200+batteries*260+pulses*140+timeBonus+(state==="victory"?2500:0)));
}
function nextLevel(){
  if(level>=5){ win(); return; }
  level++;
  pulses+=LEVEL_PULSES;
  if(pulses>0) lowSignal=-1;
  flash=1;
  Audio_.blip(880,0.22);
  spawnLevel();
  Audio_.startAmbient(level);
  syncHud(true);
}
function die(cause){
  if(state!=="playing")return;
  deathCause=cause;
  state="gameover";
  Audio_.stopAmbient(); Audio_.death();
  saveScore(); showGameOver();
}
function win(){
  state="victory";
  Audio_.stopAmbient(); Audio_.victory();
  saveScore(); showVictory();
}

/* ---------- scoreboard ---------- */
var KEY="sonarMaze.scores.v1";
var lastEntry=null;
function loadScores(){
  try{ var s=JSON.parse(localStorage.getItem(KEY)); return Array.isArray(s)?s:[]; }catch(e){ return []; }
}
function saveScore(){
  var entry={when:new Date().toLocaleString(),secs:Math.round(elapsed*10)/10,
    level:level,score:computeScore(),win:state==="victory",batteries:batteries};
  lastEntry=entry;
  var list=loadScores(); list.push(entry);
  list.sort(function(a,b){return b.score-a.score;});
  list=list.slice(0,5);
  try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){}
}
function fmt(t){
  var m=Math.floor(t/60),s=t-m*60;
  return m+":"+(s<10?"0":"")+s.toFixed(1);
}
function scoreTable(){
  var list=loadScores();
  if(!list.length) return '<p class="lead">No runs recorded yet. This one will be the first.</p>';
  var h='<table><tr><th>#</th><th>Score</th><th>Level</th><th>Time</th><th>Finished</th></tr>';
  for(var i=0;i<list.length;i++){
    var e=list[i],me=lastEntry&&e.when===lastEntry.when&&e.score===lastEntry.score;
    h+='<tr class="'+(me?"me":"")+'"><td>'+(i+1)+'</td><td>'+e.score+'</td><td>'+
       (e.win?"5 ✓":e.level)+'</td><td>'+fmt(e.secs)+'</td><td>'+e.when+'</td></tr>';
  }
  return h+'</table>';
}
function statGrid(){
  return '<div class="grid">'+
    '<div class="cell"><b>'+computeScore()+'</b><i>SCORE</i></div>'+
    '<div class="cell"><b>'+fmt(elapsed)+'</b><i>TIME</i></div>'+
    '<div class="cell"><b>'+level+' / 5</b><i>LEVEL</i></div>'+
    '<div class="cell"><b>'+pulses+'</b><i>PULSES LEFT</i></div>'+
    '<div class="cell"><b>'+batteries+'</b><i>BATTERIES FOUND</i></div>'+
    '</div>';
}

function hide(){ overlay.classList.remove("on"); }

    '<li>The green exit always shines. Some walls slide open and shut on a timer, so watch them before you commit.</li>'+

/* ---------- start / reset ---------- */
function startGame(){
  Audio_.init(); Audio_.resume();
  level=1; pulses=START_PULSES; batteries=0; elapsed=0; score=0;
  lastPing=-9999; lowSignal=-1; deathCause=""; flash=1;
  waves=[]; particles=[]; prints=[]; glitches=[];
  keys=Object.create(null);
  joyActive=false; joyId=null; joyDX=0; joyDY=0; knob.style.transform="";
  spawnLevel();
  Audio_.startAmbient(1);
  state="playing";
  hide(); syncHud(true);
}
function pause(){
  if(state!=="playing")return;
  state="paused"; Audio_.stopAmbient(); showPause();
}
function resume(){
  if(state!=="paused")return;
  state="playing"; Audio_.resume(); Audio_.startAmbient(level); hide();
}

/* ---------- HUD ---------- */
function syncHud(force){
  hudTick++;
  if(!force&&hudTick%3!==0)return;
  vLevel.textContent=level+"/5";
  vPulse.textContent=pulses;
  vBatt.textContent=batteries;
  vScore.textContent=computeScore();
  vTime.textContent=fmt(elapsed);
  if(lowSignal>0){ warnEl.style.display="block"; warnEl.textContent="Signal lost in "+lowSignal.toFixed(1)+"s — find a battery"; }
  else warnEl.style.display="none";
}

/* ---------- rendering ---------- */
function updateCamera(){
  var small=stage.clientWidth<1000;
  zoom=small?1.95:1;
  var vw=W/zoom,vh=H/zoom;
  camX=clamp(player.x-vw/2,0,W-vw);
  camY=clamp(player.y-vh/2,0,H-vh);
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  if(state==="menu"){ drawIdle(); return; }
  updateCamera();
  ctx.setTransform(zoom,0,0,zoom,-camX*zoom,-camY*zoom);

  var pal=LEVELS[level-1];

  /* footprints */
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<prints.length;i++){
    var f=prints[i],a=(f.t/f.max)*0.35;
    ctx.fillStyle=pal.accent; ctx.globalAlpha=a;
    ctx.beginPath(); ctx.ellipse(f.x-4*f.f,f.y,2.6,1.6,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x+4*f.f,f.y+2,2.6,1.6,0,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  /* walls, batched by brightness */
  drawWalls(pal);

  /* items */
  drawItems();

  /* waves */
  drawWaves(pal);

  /* exit */
  drawExit();

  /* enemies */
  for(i=0;i<enemies.length;i++) drawEnemy(enemies[i]);

  /* particles */
  ctx.globalCompositeOperation="lighter";
  for(i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.s,p.y-p.s,p.s*2,p.s*2);
  }
  ctx.globalAlpha=1;

  /* glitches */
  for(i=0;i<glitches.length;i++){
    var g=glitches[i],k=g.t/g.max;
    ctx.globalAlpha=k*0.5;
    for(var j=0;j<3;j++){
      ctx.fillStyle=j===0?"#ff4d6d":(j===1?"#4dfff0":"#ffffff");
      var oy=(Math.random()-0.5)*20,ox=(Math.random()-0.5)*16;
      ctx.fillRect(g.x-16+ox,g.y+oy,32,2);
    }
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation="source-over";

  drawPlayer(pal);

  if(flash>0){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=flash*0.12; ctx.fillStyle=pal.wall; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }
}

function drawWalls(pal){
  var buckets=[[],[],[],[],[],[],[],[],[],[]],doorB=[[],[],[],[],[],[],[],[],[],[]];
  var vw=W/zoom,vh=H/zoom,x0=camX-40,y0=camY-40,x1=camX+vw+40,y1=camY+vh+40;
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(w.glow<=0.02)continue;
    if(Math.max(w.x1,w.x2)<x0||Math.min(w.x1,w.x2)>x1||Math.max(w.y1,w.y2)<y0||Math.min(w.y1,w.y2)>y1)continue;
    var b=clamp(Math.floor(w.glow*10),0,9);
    (w.door?doorB:buckets)[b].push(w);
  }
  ctx.globalCompositeOperation="lighter";
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.setLineDash([]);
  for(var b2=9;b2>=0;b2--){
    var list=buckets[b2]; if(!list.length)continue;
    var a=(b2+0.6)/10;
    ctx.beginPath();
    for(var k=0;k<list.length;k++){ var wl=list[k]; ctx.moveTo(wl.x1,wl.y1); ctx.lineTo(wl.x2,wl.y2); }
    ctx.strokeStyle=pal.wall; ctx.globalAlpha=a*0.9;
    ctx.lineWidth=3.2; ctx.shadowColor=pal.wall; ctx.shadowBlur=16*a;
    ctx.stroke();
    ctx.shadowBlur=0; ctx.globalAlpha=a; ctx.lineWidth=1.1; ctx.strokeStyle="#ffffff";
    ctx.stroke();
  }
  /* doors: distinct colour + dashed ghost track */
  for(b2=9;b2>=0;b2--){
    var dl=doorB[b2]; if(!dl.length)continue;
    var da=(b2+0.6)/10;
    ctx.beginPath();
    for(k=0;k<dl.length;k++){ var dw=dl[k]; ctx.moveTo(dw.x1,dw.y1); ctx.lineTo(dw.x2,dw.y2); }
    ctx.setLineDash([4,7]); ctx.lineWidth=1; ctx.globalAlpha=da*0.35;
    ctx.strokeStyle="#ff6fc8"; ctx.shadowBlur=0; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    for(k=0;k<dl.length;k++){
      var w2=dl[k],n=wallSegments(w2);
      for(var s=0;s<n;s++){ ctx.moveTo(segBuf[s*4],segBuf[s*4+1]); ctx.lineTo(segBuf[s*4+2],segBuf[s*4+3]); }
    }
    ctx.globalAlpha=da; ctx.lineWidth=4.2; ctx.strokeStyle="#ff6fc8";
    ctx.shadowColor="#ff6fc8"; ctx.shadowBlur=18*da; ctx.stroke();
    ctx.shadowBlur=0; ctx.lineWidth=1.4; ctx.strokeStyle="#ffe6f5"; ctx.stroke();
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
}

function drawWaves(pal){
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<waves.length;i++){
    var w=waves[i],a=Math.max(0,w.alpha);
    ctx.strokeStyle=w.strong?"#c98bff":pal.accent;
    ctx.globalAlpha=a*0.55; ctx.lineWidth=w.strong?5:3;
    ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=22*a;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,6.283); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.globalAlpha=a*0.22; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(w.x,w.y,Math.max(0,w.r-9),0,6.283); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
}

function drawItems(){
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.lit<=0.01)continue;
    var a=it.lit,pulse=0.75+0.25*Math.sin(it.t*4);
    var col=it.kind==="battery"?"#ffd85e":"#c98bff";
    var gr=ctx.createRadialGradient(it.x,it.y,0,it.x,it.y,34);
    gr.addColorStop(0,col); gr.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalAlpha=a*0.42*pulse; ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(it.x,it.y,34,0,6.283); ctx.fill();
    ctx.globalAlpha=a;
    ctx.font="20px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(it.kind==="battery"?"🔋":"📡",it.x,it.y);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
}

function drawExit(){
  var t=elapsed*3,pulse=0.6+0.4*Math.sin(t);
  ctx.globalCompositeOperation="lighter";
  var gr=ctx.createRadialGradient(exitX,exitY,0,exitX,exitY,46);
  gr.addColorStop(0,"rgba(70,255,150,0.85)");
  gr.addColorStop(0.35,"rgba(40,220,130,0.28)");
  gr.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalAlpha=0.55+0.35*pulse; ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(exitX,exitY,46,0,6.283); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle="#8dffc0"; ctx.lineWidth=2; ctx.shadowColor="#39ff88"; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.arc(exitX,exitY,13+pulse*5,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(exitX,exitY,6,0,6.283); ctx.fillStyle="#c9ffe2"; ctx.fill();
  ctx.shadowBlur=0; ctx.globalCompositeOperation="source-over";
}

function drawEnemy(e){
  var stunned=e.stun>0;
  var col=stunned?"#7fdfff":"#ff3b4e";
  var wob=stunned?0:Math.sin(e.t*5)*2;
  ctx.save();
  ctx.translate(e.x,e.y);
  /* aura */
  ctx.globalCompositeOperation="lighter";
  var gr=ctx.createRadialGradient(0,0,0,0,0,38);
  gr.addColorStop(0,stunned?"rgba(120,220,255,0.55)":"rgba(255,40,60,0.55)");
  gr.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gr; ctx.globalAlpha=stunned?0.5:0.75+0.15*Math.sin(e.t*6);
  ctx.beginPath(); ctx.arc(0,0,38,0,6.283); ctx.fill();
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";

  if(stunned) ctx.rotate(Math.sin(e.t*30)*0.05);

  /* tendrils */
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.shadowColor=col; ctx.shadowBlur=8;
  for(var i=0;i<5;i++){
    var a=(i/5)*Math.PI*2+e.t*(stunned?0.2:0.9);
    var l=13+Math.sin(e.t*4+i)*3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);
    ctx.lineTo(Math.cos(a)*(8+l),Math.sin(a)*(8+l)+wob*0.3); ctx.stroke();
  }
  /* body */
  ctx.beginPath();
  for(i=0;i<7;i++){
    var ang=(i/7)*Math.PI*2,rr=11+Math.sin(ang*3+e.t*3)*1.6;
    var px=Math.cos(ang)*rr,py=Math.sin(ang)*rr*0.92+wob*0.2;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=stunned?"#0d2b36":"#2a0208";
  ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0;
  /* eyes */
  var blink=(e.t%e.blink)<0.12&&!stunned;
  ctx.fillStyle=stunned?"#bff2ff":"#ffe8ea";
  if(!blink){
    ctx.beginPath(); ctx.ellipse(-4.2,-2,2.6,3.1,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4.2,-2,2.6,3.1,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,3.4,1.8,2.1,0,0,6.283); ctx.fill();
    ctx.fillStyle=stunned?"#14323d":"#3a0007";
    ctx.beginPath(); ctx.arc(-4.2,-1.6,1.2,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(4.2,-1.6,1.2,0,6.283); ctx.fill();
  } else {
    ctx.fillRect(-6.6,-2.4,5,1.4); ctx.fillRect(1.6,-2.4,5,1.4);
  }
  ctx.restore();
}

function drawPlayer(pal){
  var p=player,f=p.face,swing=p.moving?Math.sin(p.walk):0,swing2=p.moving?Math.sin(p.walk+Math.PI):0;
  var lift=p.moving?Math.max(0,Math.sin(p.walk))*3.2:0,lift2=p.moving?Math.max(0,Math.sin(p.walk+Math.PI))*3.2:0;
  var ground=p.y+11,bob=p.moving?Math.abs(Math.sin(p.walk))*1.4:Math.sin(p.bob)*0.8;
  var bx=p.x,by=p.y-bob;

  ctx.save();
  ctx.globalCompositeOperation="lighter";
  var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,52);
  gr.addColorStop(0,"rgba(180,245,255,0.30)");
  gr.addColorStop(0.5,"rgba(120,210,255,0.10)");
  gr.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,52,0,6.283); ctx.fill();
  ctx.globalCompositeOperation="source-over";

  /* legs: feet stay on the ground line */
  ctx.strokeStyle="#9fe9ff"; ctx.lineWidth=2.4; ctx.lineCap="round";
  ctx.shadowColor="#7fdcff"; ctx.shadowBlur=8;
  var hipY=by+5;
  ctx.beginPath();
  ctx.moveTo(bx-4,hipY); ctx.lineTo(bx-4+swing*4,ground-lift);
  ctx.moveTo(bx+4,hipY); ctx.lineTo(bx+4+swing2*4,ground-lift2);
  ctx.stroke();
  /* feet */
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(bx-4+swing*4-2*f,ground-lift); ctx.lineTo(bx-4+swing*4+3*f,ground-lift);
  ctx.moveTo(bx+4+swing2*4-2*f,ground-lift2); ctx.lineTo(bx+4+swing2*4+3*f,ground-lift2);
  ctx.stroke();

  /* body */
  ctx.beginPath();
  ctx.moveTo(bx,by-4);
  ctx.bezierCurveTo(bx+9,by-3,bx+8,by+8,bx,by+8);
  ctx.bezierCurveTo(bx-8,by+8,bx-9,by-3,bx,by-4);
  ctx.closePath();
  ctx.fillStyle="#0b2b38"; ctx.fill();
  ctx.strokeStyle="#7fdcff"; ctx.lineWidth=2; ctx.stroke();

  /* arms */
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(bx-7,by); ctx.lineTo(bx-9-swing2*2.5,by+5-swing2*2);
  ctx.moveTo(bx+7,by); ctx.lineTo(bx+9-swing*2.5,by+5-swing*2);
  ctx.stroke();

  /* head */
  ctx.beginPath(); ctx.ellipse(bx,by-10,8.4,7.2,0,0,6.283);
  ctx.fillStyle="#0e3a4a"; ctx.fill(); ctx.strokeStyle="#9fe9ff"; ctx.lineWidth=1.8; ctx.stroke();
  /* antenna */
  ctx.beginPath(); ctx.moveTo(bx+2*f,by-16); ctx.quadraticCurveTo(bx+6*f,by-23,bx+3*f,by-25); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx+3*f,by-26,2,0,6.283);
  ctx.fillStyle=pal.accent; ctx.shadowColor=pal.accent; ctx.shadowBlur=12; ctx.fill();
  ctx.shadowBlur=6;
  /* eyes */
  ctx.fillStyle="#e9fbff";
  ctx.beginPath(); ctx.ellipse(bx-3.2*f,by-10.5,2.7,3.4,-0.25*f,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx+3.4*f,by-10.5,2.1,2.8,-0.25*f,0,6.283); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#062029";
  ctx.beginPath(); ctx.arc(bx-3.2*f+0.7*f,by-10.2,1.2,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+3.4*f+0.6*f,by-10.2,1,0,6.283); ctx.fill();
  ctx.restore();
}

/* menu backdrop */
var idleT=0;
function drawIdle(){
  idleT+=STEP;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<3;i++){
    var r=((idleT*90+i*180)%620);
    ctx.globalAlpha=Math.max(0,0.28*(1-r/620));
    ctx.strokeStyle="#00e5ff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(W/2,H/2,r,0,6.283); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
}

/* ---------- loop ---------- */
var lastT=0,acc=0,raf=0;
function loop(t){
  raf=requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=(t-lastT)/1000; lastT=t;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  if(acc<STEP)return;
  var steps=0;
  while(acc>=STEP&&steps<3){
    acc-=STEP; steps++;
    if(state==="playing"){ update(STEP); if(state!=="playing")break; }
  }
  if(state==="playing") syncHud(false);
  render();
}

/* ---------- input (registered once) ---------- */
window.addEventListener("keydown",function(e){
  if(e.code==="Space"){
    e.preventDefault();
    if(state==="menu"){ startGame(); return; }
    if(state==="paused"){ resume(); return; }
    tryPing();
    return;
  }
  if(e.code==="Escape"||e.code==="KeyP"){
    e.preventDefault();
    if(state==="playing")pause(); else if(state==="paused")resume();
    return;
  }
  if(e.code==="Enter"&&(state==="gameover"||state==="victory")){ e.preventDefault(); startGame(); return; }
  if(e.code.indexOf("Arrow")===0)e.preventDefault();
  keys[e.code]=true;
},{passive:false});
window.addEventListener("keyup",function(e){ keys[e.code]=false; });

overlay.addEventListener("click",function(e){
  var a=e.target&&e.target.dataset?e.target.dataset.action:null;
  if(!a)return;
  e.target.blur();
  Audio_.init(); Audio_.resume();
  if(a==="start"||a==="again") startGame();
  else if(a==="resume") resume();
  else if(a==="giveup"){ state="playing"; die("You called it off"); }
  else if(a==="menu"){ state="menu"; showMenu(); }
});

/* pointer / touch */
function joyZone(cx,cy){
  var r=stage.getBoundingClientRect();
  return cx<r.left+Math.min(220,r.width*0.45)&&cy>r.top+r.height*0.45;
}
function setKnob(dx,dy){
  var m=Math.sqrt(dx*dx+dy*dy),max=44;
  if(m>max){ dx=dx/m*max; dy=dy/m*max; m=max; }
  knob.style.transform="translate("+dx+"px,"+dy+"px)";
  joyDX=dx/max; joyDY=dy/max;
}
stage.addEventListener("touchstart",function(e){
  Audio_.init(); Audio_.resume();
  if(state!=="playing"){ return; }
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(joyId===null&&joyZone(t.clientX,t.clientY)){
      joyId=t.identifier; joyActive=true; joyBaseX=t.clientX; joyBaseY=t.clientY;
      setKnob(0,0);
    } else { tryPing(); }
  }
  e.preventDefault();
},{passive:false});
stage.addEventListener("touchmove",function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyId) setKnob(t.clientX-joyBaseX,t.clientY-joyBaseY);
  }
  e.preventDefault();
},{passive:false});
function endTouch(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===joyId){
      joyId=null; joyActive=false; joyDX=0; joyDY=0; knob.style.transform="";
    }
  }
}
stage.addEventListener("touchend",endTouch);
stage.addEventListener("touchcancel",endTouch);
cv.addEventListener("mousedown",function(e){
  Audio_.init(); Audio_.resume();
  if(state==="playing"){ tryPing(); e.preventDefault(); }
});

/* lifecycle */
window.addEventListener("blur",pause);
document.addEventListener("visibilitychange",function(){ if(document.hidden)pause(); });
var resizeT=0;
window.addEventListener("resize",function(){
  clearTimeout(resizeT);
  resizeT=setTimeout(function(){ pause(); },120);
});
if(screen.orientation&&screen.orientation.lock){
  try{ screen.orientation.lock("landscape").catch(function(){}); }catch(e){}
}

/* boot */
if(isTouch) joy.style.display="block";
level=1; pulses=START_PULSES; batteries=0; elapsed=0; lowSignal=-1;
showMenu();
syncHud(true);
raf=requestAnimationFrame(loop);

})();
</script>
