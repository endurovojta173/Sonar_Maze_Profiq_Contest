<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sonar Maze</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{flex:0 0 auto;height:42px;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,42px);
 background:rgba(8,10,14,.92);border-bottom:1px solid rgba(255,255,255,.10);padding:0 10px;user-select:none}
.hi{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.hi .lbl{font-size:9px;letter-spacing:.18em;color:#7a8794;text-transform:uppercase}
.hi .val{font-size:15px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#hPings{color:#7df9ff;text-shadow:0 0 10px rgba(0,229,255,.75)}
#hBat{color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.6)}
#hScore{color:#39ff88;text-shadow:0 0 10px rgba(57,255,136,.5)}
#hLost{color:#ff4d4d;font-size:12px;font-weight:700;letter-spacing:.12em;display:none;text-shadow:0 0 10px rgba(255,60,60,.8)}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#wrap{position:relative;width:100px;height:75px}
canvas{display:block;width:100%;height:100%;background:#000;border-radius:10px;box-shadow:0 0 40px rgba(0,200,255,.12),0 0 0 1px rgba(255,255,255,.07) inset}
#joy{position:absolute;left:4%;bottom:6%;width:26%;max-width:150px;aspect-ratio:1/1;border-radius:50%;
 border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);display:none;touch-action:none}
#joy.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin-left:-21%;margin-top:-21%;border-radius:50%;
 background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 18px rgba(0,229,255,.5)}
#hint{position:absolute;right:3%;bottom:6%;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.1em;pointer-events:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
 background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;overflow:auto}
.ov.on{display:flex}
.panel{width:min(680px,96vw);max-height:94vh;overflow:auto;background:rgba(10,12,16,.86);border:1px solid rgba(255,255,255,.13);
 border-radius:14px;padding:clamp(16px,3.2vw,30px);box-shadow:0 0 60px rgba(0,229,255,.10)}
.panel h1{font-size:clamp(26px,5.4vw,44px);letter-spacing:.14em;font-weight:300;margin-bottom:4px}
.panel h1 b{font-weight:700;color:#7df9ff;text-shadow:0 0 22px rgba(0,229,255,.75)}
.sub{color:#8b98a5;font-size:12px;letter-spacing:.22em;margin-bottom:16px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin-bottom:18px}
.rules p{font-size:13px;line-height:1.55;color:#c7d0d8}
.rules p span{color:#fff;font-weight:600}
.k{display:inline-block;border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:0 5px;font-size:11px;color:#fff;background:rgba(255,255,255,.06)}
.btn{appearance:none;border:1px solid rgba(0,229,255,.55);background:rgba(0,229,255,.10);color:#eaffff;font:inherit;font-size:14px;
 letter-spacing:.14em;padding:12px 26px;border-radius:9px;cursor:pointer;transition:background .15s,box-shadow .15s;margin:6px 8px 0 0}
.btn:hover{background:rgba(0,229,255,.22);box-shadow:0 0 22px rgba(0,229,255,.35)}
.btn:focus-visible{outline:2px solid #7df9ff;outline-offset:2px}
.btn.ghost{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:#cfd8df}
.btn.danger{border-color:rgba(255,80,80,.5);background:rgba(255,60,60,.10);color:#ffd7d7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0 6px}
.stat{border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.03)}
.stat i{display:block;font-style:normal;font-size:9px;letter-spacing:.18em;color:#7a8794;text-transform:uppercase}
.stat b{font-size:19px;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
th{text-align:left;font-weight:500;font-size:9px;letter-spacing:.16em;color:#7a8794;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-transform:uppercase}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#d3dbe2;font-variant-numeric:tabular-nums}
tr.me td{color:#7df9ff}
.empty{padding:14px 8px;color:#7a8794;font-size:12.5px}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#000;z-index:60;text-align:center;padding:24px}
#rotate .g{font-size:52px;color:#7df9ff;text-shadow:0 0 24px rgba(0,229,255,.8)}
#rotate h2{font-weight:400;letter-spacing:.16em;font-size:18px}
#rotate p{color:#7a8794;font-size:13px}
@media (orientation:portrait){#app,.ov{display:none!important}#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate"><div class="g">&#8635;</div><h2>Rotate your device</h2><p>Sonar Maze runs in landscape.</p></div>

<div id="app">
  <div id="hud">
    <div class="hi"><span class="lbl">Time</span><span class="val" id="hTime">00:00</span></div>
    <div class="hi"><span class="lbl">Level</span><span class="val" id="hLevel">1/5</span></div>
    <div class="hi"><span class="lbl">Pulses</span><span class="val" id="hPings">7</span></div>
    <div class="hi"><span class="lbl">Batteries</span><span class="val" id="hBat">0</span></div>
    <div class="hi"><span class="lbl">Score</span><span class="val" id="hScore">0</span></div>
    <div id="hLost">Signal lost in 12</div>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="cv" width="1000" height="750"></canvas>
      <div id="joy"><div id="knob"></div></div>
      <div id="hint">Space = sonar</div>
    </div>
  </div>
</div>

<div id="ov" class="ov"></div>

<script>
(function(){
"use strict";

/* ============================ CONSTANTS ============================ */
var W=1000,H=750,COLS=20,ROWS=15,CELL=50;
var STEP=1/30;
var PING_COOLDOWN=1000;
var WAVE_MAX=560, WAVE_SPEED=780, WAVE_BAND=9;
var SUPER_MAX=1500, SUPER_SPEED=1750;
var STUN_TIME=2, STUN_SUPER=6;
var FADE=1/3, FADE_SLOW=1/9;
var PLAYER_SPEED=152, PLAYER_R=11;
var LOST_GRACE=12;

var LEVELS=[
 {rgb:[0,229,255],  css:"#00e5ff", name:"Cyan",   enemies:4,  movers:5},
 {rgb:[178,107,255],css:"#b26bff", name:"Purple", enemies:6,  movers:6},
 {rgb:[57,255,136], css:"#39ff88", name:"Green",  enemies:8,  movers:7},
 {rgb:[255,210,63], css:"#ffd23f", name:"Gold",   enemies:10, movers:8},
 {rgb:[255,138,61], css:"#ff8a3d", name:"Orange", enemies:12, movers:9}
];
var MOVE_RGB=[255,90,220];

/* ============================ HELPERS ============================ */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return a+((Math.random()*(b-a+1))|0);}
function fmt(s){var m=(s/60)|0,x=(s%60)|0;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}

function Binder(){this.l=[];}
Binder.prototype.on=function(t,e,f,o){t.addEventListener(e,f,o);this.l.push([t,e,f,o]);};
Binder.prototype.clear=function(){for(var i=0;i<this.l.length;i++){var a=this.l[i];a[0].removeEventListener(a[1],a[2],a[3]);}this.l=[];};
var IN=new Binder(), UI=new Binder(), GLOBAL=new Binder();

/* ============================ DOM ============================ */
var cv=document.getElementById("cv"), ctx=cv.getContext("2d",{alpha:false});
var stage=document.getElementById("stage"), wrap=document.getElementById("wrap");
var joyEl=document.getElementById("joy"), knob=document.getElementById("knob"), hint=document.getElementById("hint");
var ov=document.getElementById("ov");
var hTime=document.getElementById("hTime"),hLevel=document.getElementById("hLevel"),hPings=document.getElementById("hPings"),
    hBat=document.getElementById("hBat"),hScore=document.getElementById("hScore"),hLost=document.getElementById("hLost");
var TOUCH=("ontouchstart" in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches);

/* ============================ STATE ============================ */
var G={state:"menu",level:0,pings:7,batteries:0,totalBat:0,elapsed:0,score:0,time:0,lastPing:-9999,lostTimer:0,zoom:1,flash:0,shake:0};
var segs=[], grid=null, GW=COLS+2, GH=ROWS+2;
var waves=[], enemies=[], items=[], parts=[], uparts=[], prints=[];
var exitCell={c:0,r:0}, exitPos={x:0,y:0};
var waveId=0;
var P={x:0,y:0,r:PLAYER_R,dirx:1,diry:0,walk:0,alive:true,feet:[{x:0,y:0,sw:false,fx:0,fy:0,tx:0,ty:0},{x:0,y:0,sw:false,fx:0,fy:0,tx:0,ty:0}]};
var keys={};
var joy={on:false,id:-1,cx:0,cy:0,rad:1,dx:0,dy:0};
var GLOW={};
var camX=0,camY=0;

function pal(){return LEVELS[clamp(G.level,0,4)];}

/* ============================ GLOW SPRITES ============================ */
function makeGlow(r,g,b,core){
  var c=document.createElement("canvas");c.width=c.height=128;
  var x=c.getContext("2d");
  var gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,"rgba("+r+","+g+","+b+","+(core||0.85)+")");
  gr.addColorStop(0.28,"rgba("+r+","+g+","+b+",0.30)");
  gr.addColorStop(0.62,"rgba("+r+","+g+","+b+",0.08)");
  gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)");
  x.fillStyle=gr;x.fillRect(0,0,128,128);
  return c;
}
function buildGlows(){
  GLOW.red=makeGlow(255,45,45,0.75);
  GLOW.blue=makeGlow(120,210,255,0.8);
  GLOW.green=makeGlow(60,255,140,0.9);
  GLOW.yellow=makeGlow(255,210,63,0.9);
  GLOW.purple=makeGlow(190,110,255,0.9);
  GLOW.white=makeGlow(255,255,255,0.9);
  var p=pal().rgb;
  GLOW.pal=makeGlow(p[0],p[1],p[2],0.55);
}

/* ============================ AUDIO ============================ */
var AU={
  ctx:null,master:null,amb:null,nodes:[],next:0,on:false,
  init:function(){
    if(this.ctx)return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{this.ctx=new AC();}catch(e){return;}
    this.master=this.ctx.createGain();
    this.master.gain.value=0.85;
    this.master.connect(this.ctx.destination);
  },
  resume:function(){ if(this.ctx&&this.ctx.state==="suspended"){ try{this.ctx.resume();}catch(e){} } },
  vol:function(v){ if(this.master){ try{this.master.gain.setTargetAtTime(v,this.ctx.currentTime,0.05);}catch(e){this.master.gain.value=v;} } },
  startAmbient:function(){
    if(!this.ctx||this.on)return;
    this.on=true;
    var t=this.ctx.currentTime, self=this;
    var g=this.ctx.createGain(); g.gain.value=0.0; g.connect(this.master);
    var lp=this.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=240; lp.connect(g);
    var o1=this.ctx.createOscillator(); o1.type="sine"; o1.frequency.value=43;
    var o2=this.ctx.createOscillator(); o2.type="triangle"; o2.frequency.value=57.5;
    var o3=this.ctx.createOscillator(); o3.type="sine"; o3.frequency.value=86.5;
    var g3=this.ctx.createGain(); g3.gain.value=0.25; o3.connect(g3); g3.connect(lp);
    o1.connect(lp); o2.connect(lp);
    var lfo=this.ctx.createOscillator(); lfo.type="sine"; lfo.frequency.value=0.09;
    var lg=this.ctx.createGain(); lg.gain.value=0.045; lfo.connect(lg); lg.connect(g.gain);
    o1.start(t);o2.start(t);o3.start(t);lfo.start(t);
    g.gain.setValueAtTime(0.0,t); g.gain.linearRampToValueAtTime(0.10,t+2.5);
    this.amb={g:g,os:[o1,o2,o3,lfo]};
    this.next=1.5;
    void self;
  },
  stopAmbient:function(){
    if(!this.amb)return;
    var t=this.ctx.currentTime, a=this.amb;
    try{a.g.gain.cancelScheduledValues(t);a.g.gain.setValueAtTime(a.g.gain.value,t);a.g.gain.linearRampToValueAtTime(0,t+0.5);}catch(e){}
    for(var i=0;i<a.os.length;i++){ try{a.os[i].stop(t+0.6);}catch(e){} }
    this.amb=null;this.on=false;
  },
  note:function(){
    if(!this.ctx)return;
    var sc=[110,116.54,130.81,146.83,155.56,174.61,185.00,207.65];
    var f=sc[(Math.random()*sc.length)|0]*(Math.random()<0.35?2:1);
    var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain(), fl=this.ctx.createBiquadFilter();
    fl.type="lowpass"; fl.frequency.value=900;
    o.type=Math.random()<0.5?"sine":"triangle"; o.frequency.value=f;
    o.connect(fl); fl.connect(g); g.connect(this.master);
    var dur=2.2+Math.random()*1.6, peak=0.045+G.level*0.007;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+0.7);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.05);
  },
  tick:function(dt){
    if(!this.ctx||!this.on)return;
    this.next-=dt;
    if(this.next<=0){ this.note(); this.next=Math.max(1.2,(5.4-G.level*0.62))*(0.6+Math.random()*0.9); }
  },
  ping:function(){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(1400,t);
    o.frequency.exponentialRampToValueAtTime(180,t+0.9);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.30,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.95);
  },
  superPing:function(){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(70,t+1.4);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.26,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.45);
  },
  stun:function(){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(880,t);
    o.frequency.exponentialRampToValueAtTime(140,t+0.16);
    g.gain.setValueAtTime(0.10,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.2);
  },
  pickup:function(hi){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(hi?520:660,t);
    o.frequency.exponentialRampToValueAtTime(hi?1600:1320,t+0.16);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.3);
  },
  death:function(){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var g=this.ctx.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0.28,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    var a=this.ctx.createOscillator(), b=this.ctx.createOscillator();
    a.type="square"; b.type="sawtooth";
    a.frequency.setValueAtTime(150,t); a.frequency.exponentialRampToValueAtTime(30,t+0.6);
    b.frequency.setValueAtTime(90,t);  b.frequency.exponentialRampToValueAtTime(30,t+0.6);
    a.connect(g); b.connect(g);
    a.start(t); b.start(t); a.stop(t+0.62); b.stop(t+0.62);
  },
  win:function(){
    if(!this.ctx)return;var t=this.ctx.currentTime;
    var f=[523,659,784,1047];
    for(var i=0;i<4;i++){
      var st=t+i*0.16;
      var o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type="sine"; o.frequency.value=f[i];
      g.gain.setValueAtTime(0.0001,st);
      g.gain.linearRampToValueAtTime(0.22,st+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.55);
      o.connect(g); g.connect(this.master); o.start(st); o.stop(st+0.6);
    }
  }
};

/* ============================ MAZE ============================ */
function genMaze(){
  var hor=[],ver=[],vis=[],r,c;
  for(r=0;r<=ROWS;r++){var a=[];for(c=0;c<COLS;c++)a.push(true);hor.push(a);}
  for(r=0;r<ROWS;r++){var b=[];for(c=0;c<=COLS;c++)b.push(true);ver.push(b);}
  for(r=0;r<ROWS;r++){var v=[];for(c=0;c<COLS;c++)v.push(false);vis.push(v);}
  var st=[[0,0]];vis[0][0]=true;
  while(st.length){
    var cur=st[st.length-1],cc=cur[0],cr=cur[1],nb=[];
    if(cr>0&&!vis[cr-1][cc])nb.push([cc,cr-1,0]);
    if(cr<ROWS-1&&!vis[cr+1][cc])nb.push([cc,cr+1,1]);
    if(cc>0&&!vis[cr][cc-1])nb.push([cc-1,cr,2]);
    if(cc<COLS-1&&!vis[cr][cc+1])nb.push([cc+1,cr,3]);
    if(!nb.length){st.pop();continue;}
    var p=nb[(Math.random()*nb.length)|0];
    if(p[2]===0)hor[cr][cc]=false;
    else if(p[2]===1)hor[cr+1][cc]=false;
    else if(p[2]===2)ver[cr][cc]=false;
    else ver[cr][cc+1]=false;
    vis[p[1]][p[0]]=true;st.push([p[0],p[1]]);
  }
  for(r=1;r<ROWS;r++)for(c=0;c<COLS;c++)if(Math.random()<0.11)hor[r][c]=false;
  for(r=0;r<ROWS;r++)for(c=1;c<COLS;c++)if(Math.random()<0.11)ver[r][c]=false;
  return {hor:hor,ver:ver};
}

function mkSeg(x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  return {x1:x1,y1:y1,x2:x2,y2:y2,ux:dx/len,uy:dy/len,len:len,
    nx:-dy/len,ny:dx/len,
    ax1:x1,ay1:y1,ax2:x2,ay2:y2,
    light:0,fade:FADE,hit:-1,mov:false,ph:0,sp:0,open:0,solid:true};
}

function buildLevelWalls(m){
  segs=[];
  var r,c;
  for(r=0;r<=ROWS;r++)for(c=0;c<COLS;c++)if(m.hor[r][c])segs.push(mkSeg(c*CELL,r*CELL,(c+1)*CELL,r*CELL));
  for(r=0;r<ROWS;r++)for(c=0;c<=COLS;c++)if(m.ver[r][c])segs.push(mkSeg(c*CELL,r*CELL,c*CELL,(r+1)*CELL));

  var cand=[],i;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    var border=(s.y1===0&&s.y2===0)||(s.y1===H&&s.y2===H)||(s.x1===0&&s.x2===0)||(s.x1===W&&s.x2===W);
    if(!border)cand.push(i);
  }
  var want=pal().movers;
  for(i=0;i<want&&cand.length;i++){
    var k=(Math.random()*cand.length)|0, sg=segs[cand[k]];
    cand.splice(k,1);
    sg.mov=true; sg.ph=Math.random()*6.283; sg.sp=rnd(0.5,0.95);
  }

  grid=new Array(GW*GH);
  for(i=0;i<grid.length;i++)grid[i]=null;
  function reg(cx,cy,idx){
    if(cx<-1||cy<-1||cx>COLS||cy>ROWS)return;
    var id=(cy+1)*GW+(cx+1);
    if(!grid[id])grid[id]=[];
    grid[id].push(idx);
  }
  for(i=0;i<segs.length;i++){
    var s2=segs[i];
    if(s2.y1===s2.y2){var rr=(s2.y1/CELL)|0,ccc=(Math.min(s2.x1,s2.x2)/CELL)|0;reg(ccc,rr-1,i);reg(ccc,rr,i);}
    else{var cc2=(s2.x1/CELL)|0,rr2=(Math.min(s2.y1,s2.y2)/CELL)|0;reg(cc2-1,rr2,i);reg(cc2,rr2,i);}
  }
}

function bfs(m){
  var dist=[],r,c;
  for(r=0;r<ROWS;r++){var a=[];for(c=0;c<COLS;c++)a.push(-1);dist.push(a);}
  var q=[[0,0]];dist[0][0]=0;var head=0;
  while(head<q.length){
    var n=q[head++],cc=n[0],cr=n[1],d=dist[cr][cc];
    if(cr>0&&!m.hor[cr][cc]&&dist[cr-1][cc]<0){dist[cr-1][cc]=d+1;q.push([cc,cr-1]);}
    if(cr<ROWS-1&&!m.hor[cr+1][cc]&&dist[cr+1][cc]<0){dist[cr+1][cc]=d+1;q.push([cc,cr+1]);}
    if(cc>0&&!m.ver[cr][cc]&&dist[cr][cc-1]<0){dist[cr][cc-1]=d+1;q.push([cc-1,cr]);}
    if(cc<COLS-1&&!m.ver[cr][cc+1]&&dist[cr][cc+1]<0){dist[cr][cc+1]=d+1;q.push([cc+1,cr]);}
  }
  return dist;
}

/* ============================ BROADPHASE ============================ */
var qout=[];
function queryWalls(x,y){
  qout.length=0;
  var cx=Math.floor(x/CELL),cy=Math.floor(y/CELL),i,j,k,arr;
  for(j=-1;j<=1;j++)for(i=-1;i<=1;i++){
    var gx=cx+i,gy=cy+j;
    if(gx<-1||gy<-1||gx>COLS||gy>ROWS)continue;
    arr=grid[(gy+1)*GW+(gx+1)];
    if(!arr)continue;
    for(k=0;k<arr.length;k++)qout.push(arr[k]);
  }
  return qout;
}

/* ============================ COLLISION ============================ */
function resolveAt(o,rad,bounce){
  var list=queryWalls(o.x,o.y),i;
  for(i=0;i<list.length;i++){
    var s=segs[list[i]];
    if(!s.solid)continue;
    var ex=s.ax2-s.ax1, ey=s.ay2-s.ay1;
    var l2=ex*ex+ey*ey;
    var t=0;
    if(l2>1e-9)t=clamp(((o.x-s.ax1)*ex+(o.y-s.ay1)*ey)/l2,0,1);
    var px=s.ax1+ex*t, py=s.ay1+ey*t;
    var dx=o.x-px, dy=o.y-py, d2=dx*dx+dy*dy;
    if(d2>=rad*rad)continue;
    var nx,ny,d;
    if(d2<1e-6){ nx=s.nx; ny=s.ny; d=0; }
    else { d=Math.sqrt(d2); nx=dx/d; ny=dy/d; }
    var push=rad-d+0.05;
    o.x+=nx*push; o.y+=ny*push;
    if(bounce){
      var dot=o.vx*nx+o.vy*ny;
      if(dot<0){ o.vx-=2*dot*nx; o.vy-=2*dot*ny; }
    }
  }
  o.x=clamp(o.x,rad+0.5,W-rad-0.5);
  o.y=clamp(o.y,rad+0.5,H-rad-0.5);
}
function moveResolved(o,dx,dy,rad,bounce){
  var SUB=4,i;
  for(i=0;i<SUB;i++){
    o.x+=dx/SUB; o.y+=dy/SUB;
    resolveAt(o,rad,bounce);
  }
}

/* ============================ LEVEL SETUP ============================ */
function initLevel(){
  var m=genMaze();
  buildLevelWalls(m);
  buildGlows();
  waves.length=0;parts.length=0;uparts.length=0;prints.length=0;
  enemies.length=0;items.length=0;
  var dist=bfs(m),r,c;

  var best=-1,bc=0,br=0;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(dist[r][c]>best){best=dist[r][c];bc=c;br=r;}
  exitCell={c:bc,r:br};
  exitPos={x:bc*CELL+CELL/2,y:br*CELL+CELL/2};

  P.x=CELL/2;P.y=CELL/2;P.dirx=1;P.diry=0;P.walk=0;P.alive=true;
  for(var f=0;f<2;f++){var ft=P.feet[f];ft.x=P.x;ft.y=P.y+6;ft.sw=false;ft.fx=ft.x;ft.fy=ft.y;ft.tx=ft.x;ft.ty=ft.y;}

  var pool=[];
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(dist[r][c]>4&&!(c===bc&&r===br))pool.push([c,r]);
  function take(){ if(!pool.length)return [ri(2,COLS-2),ri(2,ROWS-2)]; var k=(Math.random()*pool.length)|0; return pool.splice(k,1)[0]; }

  var n=pal().enemies,i;
  for(i=0;i<n;i++){
    var p=take();
    var mob=(i<Math.ceil(n*0.62));
    var ang=Math.random()*6.283, sp=rnd(52,86);
    enemies.push({x:p[0]*CELL+CELL/2,y:p[1]*CELL+CELL/2,r:12,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,mob:mob,sp:sp,
      stun:0,wave:-1,ph:Math.random()*6.283,turn:rnd(1.5,4)});
  }
  var nb=ri(2,3);
  for(i=0;i<nb;i++){var pb=take();items.push({x:pb[0]*CELL+CELL/2,y:pb[1]*CELL+CELL/2,type:"bat",light:0,fade:FADE,hit:-1,got:false});}
  var ns=Math.random()<0.75?1:2;
  for(i=0;i<ns;i++){var ps=take();items.push({x:ps[0]*CELL+CELL/2,y:ps[1]*CELL+CELL/2,type:"sup",light:0,fade:FADE,hit:-1,got:false});}

  G.lostTimer=0;G.flash=1;
}

/* ============================ SONAR ============================ */
function fireWave(x,y,sup){
  waves.push({x:x,y:y,r:0,max:sup?SUPER_MAX:WAVE_MAX,sp:sup?SUPER_SPEED:WAVE_SPEED,id:++waveId,sup:!!sup});
}
function ping(){
  if(G.state!=="play")return;
  var now=performance.now();
  if(now-G.lastPing<PING_COOLDOWN)return;
  if(G.pings<=0)return;
  G.lastPing=now;
  G.pings--;
  fireWave(P.x,P.y,false);
  AU.ping();
}

function updateWaves(dt){
  var i,j;
  for(i=waves.length-1;i>=0;i--){
    var w=waves[i];
    w.r+=w.sp*dt;
    var band=w.sp*STEP*0.6+WAVE_BAND;
    var rin=w.r-band, rout=w.r+band;
    var ro2=rout*rout, ri2=rin>0?rin*rin:-1;

    for(j=0;j<segs.length;j++){
      var s=segs[j];
      if(s.hit===w.id)continue;
      var ex=s.ax2-s.ax1, ey=s.ay2-s.ay1, l2=ex*ex+ey*ey;
      var t=0;
      if(l2>1e-9)t=clamp(((w.x-s.ax1)*ex+(w.y-s.ay1)*ey)/l2,0,1);
      var px=s.ax1+ex*t, py=s.ay1+ey*t;
      var dx=w.x-px, dy=w.y-py, d2=dx*dx+dy*dy;
      if(d2<=ro2&&(ri2<0||d2>=ri2)){
        s.hit=w.id; s.light=1; s.fade=w.sup?FADE_SLOW:FADE;
        spawnSparks(px,py,s,w.sup);
      }
    }
    for(j=0;j<items.length;j++){
      var it=items[j];
      if(it.got||it.hit===w.id)continue;
      var idx=w.x-it.x, idy=w.y-it.y, id2=idx*idx+idy*idy;
      if(id2<=ro2&&(ri2<0||id2>=ri2)){ it.hit=w.id; it.light=1; it.fade=w.sup?FADE_SLOW:FADE; }
    }
    for(j=0;j<enemies.length;j++){
      var e=enemies[j];
      if(e.wave===w.id)continue;
      var edx=w.x-e.x, edy=w.y-e.y;
      if(edx*edx+edy*edy<=w.r*w.r){
        e.wave=w.id;
        e.stun=w.sup?STUN_SUPER:STUN_TIME;
        spawnGlitch(e.x,e.y);
        AU.stun();
      }
    }
    if(w.r>w.max)waves.splice(i,1);
  }
}

function updateWallFade(dt){
  var i;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.light>0){ s.light-=s.fade*dt; if(s.light<0)s.light=0; }
  }
  for(i=0;i<items.length;i++){
    var it=items[i];
    if(it.light>0){ it.light-=it.fade*dt; if(it.light<0)it.light=0; }
  }
}

function updateMovers(){
  var t=G.time,i;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(!s.mov)continue;
    var o=clamp(Math.sin(t*s.sp+s.ph)*1.55+0.5,0,1);
    s.open=o;
    var off=s.len*o;
    s.ax1=s.x1+s.ux*off; s.ay1=s.y1+s.uy*off;
    s.solid=o<0.97;
  }
}

/* ============================ PARTICLES ============================ */
function spawnSparks(x,y,s,big){
  if(parts.length>360)return;
  var n=big?3:2,i;
  for(i=0;i<n;i++){
    var a=Math.atan2(s.nx,s.ny)+rnd(-1.2,1.2);
    var sp=rnd(40,130);
    var dirn=Math.random()<0.5?1:-1;
    parts.push({x:x,y:y,vx:s.nx*dirn*sp+rnd(-30,30),vy:s.ny*dirn*sp+rnd(-30,30),
      life:rnd(0.35,0.7),max:0.7,size:rnd(1,2.1),type:0});
    void a;
  }
}
function spawnGlitch(x,y){
  if(parts.length>360)return;
  for(var i=0;i<7;i++){
    parts.push({x:x+rnd(-14,14),y:y+rnd(-14,14),vx:rnd(-24,24),vy:rnd(-24,24),
      life:rnd(0.2,0.45),max:0.45,size:rnd(3,10),type:1});
  }
}
function spawnBurst(x,y,rgb,n){
  for(var i=0;i<n;i++){
    if(parts.length>420)break;
    var a=Math.random()*6.283, sp=rnd(50,220);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(0.4,1.0),max:1.0,
      size:rnd(1.2,2.6),type:2,c:rgb});
  }
}
function updateParticles(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type!==1){ p.vy+=190*dt; p.vx*=0.985; p.vy*=0.985; }
  }
  for(i=uparts.length-1;i>=0;i--){
    var u=uparts[i];
    u.t+=dt*1.25;
    if(u.t>=1){uparts.splice(i,1);continue;}
    var k=u.t*u.t*(3-2*u.t);
    u.x=u.sx+(u.tx-u.sx)*k+Math.sin(u.t*7+u.o)*(1-u.t)*22;
    u.y=u.sy+(u.ty-u.sy)*k-Math.sin(u.t*3.14)*40;
  }
  for(i=prints.length-1;i>=0;i--){
    prints[i].life-=dt;
    if(prints[i].life<=0)prints.splice(i,1);
  }
}
function uiTarget(){
  var rc=cv.getBoundingClientRect(), pr=hPings.getBoundingClientRect();
  var sx=rc.width>0?W/rc.width:1, sy=rc.height>0?H/rc.height:1;
  return {x:(pr.left+pr.width/2-rc.left)*sx, y:(pr.top+pr.height/2-rc.top)*sy};
}
function spawnUI(wx,wy,col){
  var tg=uiTarget();
  var sx=(wx-camX)*G.zoom, sy=(wy-camY)*G.zoom;
  for(var i=0;i<12;i++){
    uparts.push({sx:sx+rnd(-8,8),sy:sy+rnd(-8,8),x:sx,y:sy,tx:tg.x+rnd(-6,6),ty:tg.y+rnd(-6,6),
      t:-i*0.03,o:Math.random()*6.283,c:col,s:rnd(1.4,2.8)});
  }
}

/* ============================ PLAYER ============================ */
function inputVec(){
  var dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx-=1;
  if(keys.ArrowRight||keys.KeyD)dx+=1;
  if(keys.ArrowUp||keys.KeyW)dy-=1;
  if(keys.ArrowDown||keys.KeyS)dy+=1;
  if(joy.on){dx+=joy.dx;dy+=joy.dy;}
  var l=Math.sqrt(dx*dx+dy*dy);
  if(l>1){dx/=l;dy/=l;l=1;}
  return {x:dx,y:dy,l:l};
}
function updatePlayer(dt){
  var v=inputVec();
  var moving=v.l>0.08;
  if(moving){
    P.dirx=v.x/v.l;P.diry=v.y/v.l;
    moveResolved(P,v.x*PLAYER_SPEED*dt,v.y*PLAYER_SPEED*dt,P.r,false);
    P.walk+=(v.l*PLAYER_SPEED*dt)/26;
  }
  updateFeet(dt,moving);
}
function updateFeet(dt,moving){
  var stride=15, i;
  var px=-P.diry, py=P.dirx;
  var swinging=false;
  for(i=0;i<2;i++){
    var f=P.feet[i];
    var side=(i===0?-1:1)*5;
    var hx=P.x+px*side, hy=P.y+py*side+4;
    var ph=(P.walk+i*0.5)%1;
    if(ph<0)ph+=1;
    var far=(f.x-hx)*(f.x-hx)+(f.y-hy)*(f.y-hy)>900;
    if(ph<0.5){
      if(f.sw){ f.sw=false; f.x=f.tx; f.y=f.ty; addPrint(f.x,f.y); }
      if(far){ f.x=hx+P.dirx*6; f.y=hy+P.diry*6; }
    }else{
      if(!f.sw){ f.sw=true; f.fx=f.x; f.fy=f.y; f.tx=hx+P.dirx*stride; f.ty=hy+P.diry*stride; }
      var q=(ph-0.5)*2;
      f.x=f.fx+(f.tx-f.fx)*q;
      f.y=f.fy+(f.ty-f.fy)*q-Math.sin(q*Math.PI)*4.5;
      swinging=true;
    }
  }
  if(!moving&&swinging)P.walk+=dt*1.3;
}
function addPrint(x,y){
  if(prints.length>70)prints.shift();
  prints.push({x:x,y:y,life:5,a:Math.atan2(P.diry,P.dirx)});
}

/* ============================ ENEMIES ============================ */
function updateEnemies(dt){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.stun>0){ e.stun-=dt; continue; }
    if(!e.mob)continue;
    e.turn-=dt;
    if(e.turn<=0){
      e.turn=rnd(1.8,4.5);
      var a=Math.atan2(e.vy,e.vx)+rnd(-0.9,0.9);
      e.vx=Math.cos(a)*e.sp; e.vy=Math.sin(a)*e.sp;
    }
    moveResolved(e,e.vx*dt,e.vy*dt,e.r,true);
    var m=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
    if(m>0.001){ e.vx=e.vx/m*e.sp; e.vy=e.vy/m*e.sp; }
    else { var b=Math.random()*6.283; e.vx=Math.cos(b)*e.sp; e.vy=Math.sin(b)*e.sp; }
  }
}

/* ============================ GAME RULES ============================ */
function checkCollect(){
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.got)continue;
    var dx=it.x-P.x,dy=it.y-P.y;
    if(dx*dx+dy*dy<24*24){
      it.got=true;
      if(it.type==="bat"){
        G.pings+=3;G.batteries++;G.totalBat++;
        spawnUI(it.x,it.y,[255,210,63]);
        spawnBurst(it.x,it.y,[255,210,63],14);
        AU.pickup(false);
      }else{
        fireWave(it.x,it.y,true);
        spawnBurst(it.x,it.y,[190,110,255],20);
        AU.superPing();
      }
      G.lostTimer=0;
    }
  }
}
function checkEnemies(){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.stun>0)continue;
    var dx=e.x-P.x,dy=e.y-P.y,rr=e.r+P.r-2;
    if(dx*dx+dy*dy<rr*rr){ die(); return; }
  }
}
function checkExit(){
  var dx=exitPos.x-P.x,dy=exitPos.y-P.y;
  if(dx*dx+dy*dy<26*26)nextLevel();
}
function lossCheck(dt){
  if(G.pings<=0&&waves.length===0){
    G.lostTimer+=dt;
    if(G.lostTimer>=LOST_GRACE)gameOver("Signal lost");
  }else G.lostTimer=0;
}

function nextLevel(){
  spawnBurst(exitPos.x,exitPos.y,[60,255,140],26);
  if(G.level>=4){ victory(); return; }
  G.level++;
  G.pings+=5;
  AU.pickup(true);
  initLevel();
}
function die(){
  P.alive=false;
  spawnBurst(P.x,P.y,[255,70,70],36);
  AU.death();AU.stopAmbient();
  G.state="dying";
  G.deathT=0;
}
function gameOver(reason){
  if(G.state==="over"||G.state==="won")return;
  G.state="over";
  AU.stopAmbient();
  G.score=computeScore(false);
  saveScore(false);
  showOver(reason||"Game over");
}
function victory(){
  G.state="won";
  AU.stopAmbient();AU.win();
  G.level=4;
  G.score=computeScore(true);
  saveScore(true);
  showVictory();
}
function computeScore(win){
  var lvl=(win?5:G.level)*2000;
  var tb=Math.max(0,Math.round((320-G.elapsed)*22));
  return Math.max(0,lvl+tb+G.pings*300+G.totalBat*500+(win?6000:0));
}

/* ============================ SCORES ============================ */
var LS="sonarmaze.scores.v1";
function loadScores(){
  try{var s=localStorage.getItem(LS);if(!s)return [];var a=JSON.parse(s);return a instanceof Array?a:[];}catch(e){return [];}
}
var lastEntry=null;
function saveScore(win){
  var d=new Date();
  var e={score:G.score,level:(win?5:G.level+1),time:fmt(G.elapsed),
    when:d.toLocaleDateString()+" "+(d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes(),
    st:d.getTime(),win:!!win};
  lastEntry=e;
  var a=loadScores();a.push(e);
  a.sort(function(x,y){return y.score-x.score;});

}
function scoreTable(){

  var h='<table><thead><tr><th>#</th><th>Finished</th><th>Time</th><th>Level</th><th>Score</th></tr></thead><tbody>';

/* ============================ RENDER ============================ */
var bN=[],bM=[];
(function(){for(var i=0;i<10;i++){bN.push([]);bM.push([]);}})();

function getCam(){
  if(G.zoom<=1.001){camX=0;camY=0;return;}
  var vw=W/G.zoom, vh=H/G.zoom;
  var tx=clamp(P.x-vw/2,0,W-vw), ty=clamp(P.y-vh/2,0,H-vh);
  camX+=(tx-camX)*0.18; camY+=(ty-camY)*0.18;
}

function drawWalls(){
  var i,b;
  for(i=0;i<10;i++){bN[i].length=0;bM[i].length=0;}
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.light<=0.02)continue;
    b=(s.light*10)|0; if(b>9)b=9;
    (s.mov?bM[b]:bN[b]).push(s);
  }
  var p=pal().rgb, R=p[0],Gc=p[1],B=p[2];
  ctx.globalCompositeOperation="lighter";
  ctx.lineCap="round";
  var pass;
  for(pass=0;pass<2;pass++){
    var arrs=pass?bM:bN;
    var cr=pass?MOVE_RGB[0]:R, cg=pass?MOVE_RGB[1]:Gc, cb=pass?MOVE_RGB[2]:B;
    var shc="rgb("+cr+","+cg+","+cb+")";
    if(pass){ctx.setLineDash([9,6]);ctx.lineDashOffset=-G.time*22;}else ctx.setLineDash([]);
    for(b=9;b>=0;b--){
      var arr=arrs[b];
      if(!arr.length)continue;
      var a=(b+0.6)/10;
      ctx.beginPath();
      for(i=0;i<arr.length;i++){var s2=arr[i];ctx.moveTo(s2.ax1,s2.ay1);ctx.lineTo(s2.ax2,s2.ay2);}
      ctx.shadowColor=shc; ctx.shadowBlur=pass?22:16;
      ctx.strokeStyle="rgba("+cr+","+cg+","+cb+","+(a*0.22).toFixed(3)+")";
      ctx.lineWidth=pass?7:8;
      ctx.stroke();
      ctx.shadowBlur=0;
      ctx.strokeStyle="rgba("+cr+","+cg+","+cb+","+a.toFixed(3)+")";
      ctx.lineWidth=pass?2.2:2.6;
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.globalCompositeOperation="source-over";
}

function drawExit(){
  var t=G.time;
  var pu=0.5+0.5*Math.sin(t*3.1);
  ctx.globalCompositeOperation="lighter";
  var sz=110+pu*26;
  ctx.drawImage(GLOW.green,exitPos.x-sz/2,exitPos.y-sz/2,sz,sz);
  ctx.strokeStyle="rgba(60,255,140,"+(0.55+pu*0.4).toFixed(2)+")";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(exitPos.x,exitPos.y,13+pu*5,0,6.283);ctx.stroke();
  ctx.beginPath();ctx.arc(exitPos.x,exitPos.y,20+pu*9,0,6.283);
  ctx.strokeStyle="rgba(60,255,140,"+(0.20*(1-pu)+0.08).toFixed(2)+")";ctx.stroke();
  ctx.fillStyle="rgba(190,255,215,"+(0.7+pu*0.3).toFixed(2)+")";
  ctx.beginPath();ctx.arc(exitPos.x,exitPos.y,4.5,0,6.283);ctx.fill();
  ctx.globalCompositeOperation="source-over";
}

function drawItems(){
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.got||it.light<=0.02)continue;
    var a=Math.min(1,it.light*1.3);
    var bob=Math.sin(G.time*2.6+it.x*0.05)*2.5;
    ctx.globalAlpha=a;
    var g=it.type==="bat"?GLOW.yellow:GLOW.purple;
    ctx.drawImage(g,it.x-40,it.y-40+bob,80,80);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=a;
    ctx.font="21px serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(it.type==="bat"?"\uD83D\uDD0B":"\uD83D\uDCE1",it.x,it.y+bob);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="lighter";
  }
  ctx.globalCompositeOperation="source-over";
}

function drawPrints(){
  var p=pal().rgb;
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<prints.length;i++){
    var f=prints[i], a=(f.life/5)*0.42;
    ctx.fillStyle="rgba("+p[0]+","+p[1]+","+p[2]+","+a.toFixed(3)+")";
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
    ctx.beginPath();ctx.ellipse(0,0,3.4,1.9,0,0,6.283);ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
}

function drawWaves(){
  var p=pal().rgb;
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<waves.length;i++){
    var w=waves[i];
    var k=1-w.r/w.max;
    if(k<=0)continue;
    var c=w.sup?[190,110,255]:p;
    ctx.strokeStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+(k*0.85).toFixed(3)+")";
    ctx.lineWidth=w.sup?4:2.5;
    ctx.shadowColor="rgb("+c[0]+","+c[1]+","+c[2]+")";
    ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.283);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+(k*0.22).toFixed(3)+")";
    ctx.lineWidth=w.sup?16:9;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation="source-over";
}

function drawParticles(){
  var p=pal().rgb;
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<parts.length;i++){
    var q=parts[i], a=clamp(q.life/q.max,0,1);
    if(q.type===1){
      ctx.fillStyle="rgba(150,230,255,"+(a*0.75).toFixed(3)+")";
      ctx.fillRect(q.x,q.y,q.size,1.6);
    }else if(q.type===2){
      ctx.fillStyle="rgba("+q.c[0]+","+q.c[1]+","+q.c[2]+","+a.toFixed(3)+")";
      ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);
    }else{
      ctx.fillStyle="rgba("+p[0]+","+p[1]+","+p[2]+","+a.toFixed(3)+")";
      ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);
    }
  }
  ctx.globalCompositeOperation="source-over";
}

function drawEnemy(e){
  var st=e.stun>0;
  var jx=st?rnd(-1.4,1.4):0, jy=st?rnd(-1.4,1.4):0;
  var x=e.x+jx, y=e.y+jy;
  var t=G.time;
  ctx.globalCompositeOperation="lighter";
  var gs=e.r*7;
  ctx.drawImage(st?GLOW.blue:GLOW.red,x-gs/2,y-gs/2,gs,gs);
  ctx.globalCompositeOperation="source-over";

  var main=st?"#8fd8ff":"#ff3b3b";
  var fill=st?"rgba(12,42,62,.95)":"rgba(44,6,6,.95)";

  ctx.strokeStyle=main;ctx.lineWidth=1.8;ctx.lineCap="round";
  var i;
  for(i=0;i<4;i++){
    var a=Math.PI*0.25+i*(Math.PI*0.166);
    var wob=st?0:Math.sin(t*6+i+e.ph)*0.35;
    var lx=x+Math.cos(a+wob)*e.r*1.55, ly=y+Math.sin(a+wob)*e.r*1.55;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*e.r*0.6,y+Math.sin(a)*e.r*0.6);
    ctx.quadraticCurveTo(x+Math.cos(a)*e.r*1.2,y+Math.sin(a)*e.r*1.35,lx,ly);
    ctx.stroke();
  }
  ctx.beginPath();
  for(i=0;i<=14;i++){
    var an=i/14*6.283;
    var rr=e.r*(1+0.13*Math.sin(an*3+(st?0:t*4.2)+e.ph));
    var px=x+Math.cos(an)*rr, py=y+Math.sin(an)*rr*0.94;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=main;ctx.lineWidth=1.8;ctx.stroke();

  ctx.beginPath();ctx.moveTo(x-e.r*0.55,y-e.r*0.72);ctx.lineTo(x,y-e.r*1.45);ctx.lineTo(x+e.r*0.55,y-e.r*0.72);
  ctx.strokeStyle=main;ctx.lineWidth=1.4;ctx.stroke();

  var ex=P.x-x, ey=P.y-y, el=Math.sqrt(ex*ex+ey*ey)||1;
  ex=ex/el*1.6; ey=ey/el*1.6;
  for(i=0;i<2;i++){
    var ox=x+(i?4.6:-4.6), oy=y-2.2;
    ctx.fillStyle=st?"#cfefff":"#fff5f5";
    ctx.beginPath();ctx.arc(ox,oy,3.3,0,6.283);ctx.fill();
    ctx.fillStyle=st?"#0a2b40":"#1a0000";
    ctx.beginPath();ctx.arc(ox+ex,oy+ey,1.6,0,6.283);ctx.fill();
  }
  ctx.strokeStyle=st?"#cfefff":"#ffb0b0";ctx.lineWidth=1.2;
  ctx.beginPath();
  if(st){ ctx.moveTo(x-4,y+5.5);ctx.lineTo(x+4,y+5.5); }
  else{ ctx.moveTo(x-4.5,y+5);ctx.lineTo(x-1.5,y+7.4);ctx.lineTo(x+1.5,y+5);ctx.lineTo(x+4.5,y+7.4); }
  ctx.stroke();

  if(st){
    ctx.globalCompositeOperation="lighter";
    ctx.strokeStyle="rgba(160,235,255,.8)";ctx.lineWidth=1;
    for(i=0;i<2;i++){
      var yy=y+rnd(-e.r,e.r);
      ctx.beginPath();ctx.moveTo(x-e.r,yy);ctx.lineTo(x+e.r,yy);ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";
  }
}

function drawPlayer(){
  var t=G.time, p=pal().rgb, col=pal().css;
  ctx.globalCompositeOperation="lighter";
  ctx.drawImage(GLOW.pal,P.x-58,P.y-58,116,116);
  ctx.globalCompositeOperation="source-over";

  var px=-P.diry, py=P.dirx;
  ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.lineCap="round";
  for(var i=0;i<2;i++){
    var f=P.feet[i], side=(i===0?-1:1)*4.5;
    var hx=P.x+px*side, hy=P.y+3;
    var mx=(hx+f.x)/2-P.dirx*1.5, my=(hy+f.y)/2+3;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(mx,my,f.x,f.y);ctx.stroke();
    ctx.fillStyle=col;
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.atan2(P.diry,P.dirx));
    ctx.beginPath();ctx.ellipse(1,0,3.6,2.1,0,0,6.283);ctx.fill();ctx.restore();
  }

  var bob=Math.sin(P.walk*6.283*2)*0.9;
  var bx=P.x, by=P.y-4+bob;

  ctx.strokeStyle=col;ctx.lineWidth=2;
  for(i=0;i<2;i++){
    var s=(i===0?-1:1);
    var sw=Math.sin(P.walk*6.283*2+(i?0:Math.PI))*3.2;
    ctx.beginPath();
    ctx.moveTo(bx+px*s*7,by+1);
    ctx.quadraticCurveTo(bx+px*s*12,by+5+sw,bx+px*s*10+P.dirx*3,by+9+sw);
    ctx.stroke();
  }

  ctx.beginPath();ctx.ellipse(bx,by+1,9,10.5,0,0,6.283);
  ctx.fillStyle="rgba(6,26,34,.96)";ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.ellipse(bx-3,by-1,3,4.4,-0.4,0,6.283);
  ctx.fillStyle="rgba("+p[0]+","+p[1]+","+p[2]+",.16)";ctx.fill();

  var hy2=by-11;
  ctx.beginPath();ctx.ellipse(bx,hy2,8.4,7.6,0,0,6.283);
  ctx.fillStyle="rgba(8,34,44,.98)";ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();

  ctx.beginPath();ctx.moveTo(bx+1,hy2-7);ctx.quadraticCurveTo(bx+5,hy2-14,bx+2.5+Math.sin(t*3)*2,hy2-17);
  ctx.lineWidth=1.6;ctx.stroke();
  ctx.globalCompositeOperation="lighter";
  ctx.drawImage(GLOW.white,bx+2.5+Math.sin(t*3)*2-11,hy2-17-11,22,22);
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#ffffff";
  ctx.beginPath();ctx.arc(bx+2.5+Math.sin(t*3)*2,hy2-17,1.8,0,6.283);ctx.fill();

  var lx=P.dirx*1.7, ly=P.diry*1.4;
  ctx.fillStyle="#eafcff";
  ctx.beginPath();ctx.ellipse(bx-3.2,hy2-0.5,3.5,4,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(bx+3.2,hy2-0.5,3.5,4,0,0,6.283);ctx.fill();
  ctx.fillStyle="#04121a";
  ctx.beginPath();ctx.arc(bx-3.2+lx,hy2-0.5+ly,1.7,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(bx+3.2+lx,hy2-0.5+ly,1.7,0,6.283);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.beginPath();ctx.arc(bx-4.1+lx,hy2-1.6+ly,0.7,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(bx+2.3+lx,hy2-1.6+ly,0.7,0,6.283);ctx.fill();

  ctx.strokeStyle=col;ctx.lineWidth=1.3;
  ctx.beginPath();ctx.arc(bx,hy2+3.4,2.4,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
}

function drawUIParticles(){
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<uparts.length;i++){
    var u=uparts[i];
    if(u.t<0)continue;
    var a=clamp(1-u.t,0,1);
    ctx.fillStyle="rgba("+u.c[0]+","+u.c[1]+","+u.c[2]+","+a.toFixed(3)+")";
    ctx.fillRect(u.x-u.s/2,u.y-u.s/2,u.s,u.s);
  }
  ctx.globalCompositeOperation="source-over";
}

function drawExitArrow(){
  if(G.zoom<=1.001)return;
  var vw=W/G.zoom, vh=H/G.zoom;
  if(exitPos.x>camX+8&&exitPos.x<camX+vw-8&&exitPos.y>camY+8&&exitPos.y<camY+vh-8)return;
  var sx=(exitPos.x-camX)*G.zoom, sy=(exitPos.y-camY)*G.zoom;
  var cx=W/2, cy=H/2;
  var dx=sx-cx, dy=sy-cy, l=Math.sqrt(dx*dx+dy*dy)||1;
  dx/=l;dy/=l;
  var m=Math.min((W/2-34)/Math.abs(dx||0.0001),(H/2-34)/Math.abs(dy||0.0001));
  var ax=cx+dx*m, ay=cy+dy*m;
  ctx.globalCompositeOperation="lighter";
  ctx.drawImage(GLOW.green,ax-26,ay-26,52,52);
  ctx.save();ctx.translate(ax,ay);ctx.rotate(Math.atan2(dy,dx));
  ctx.fillStyle="rgba(80,255,160,.9)";
  ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,6);ctx.lineTo(-6,-6);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation="source-over";
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  if(G.state==="menu"){ drawMenuBg(); return; }
  getCam();
  ctx.save();
  var shx=0,shy=0;
  if(G.shake>0){shx=rnd(-1,1)*G.shake*6;shy=rnd(-1,1)*G.shake*6;}
  ctx.translate(shx,shy);
  ctx.scale(G.zoom,G.zoom);
  ctx.translate(-camX,-camY);
  drawWalls();
  drawExit();
  drawItems();
  drawPrints();
  drawWaves();
  drawParticles();
  for(var i=0;i<enemies.length;i++)drawEnemy(enemies[i]);
  if(P.alive)drawPlayer();
  ctx.restore();
  drawUIParticles();
  drawExitArrow();
  if(G.flash>0){
    ctx.globalCompositeOperation="lighter";
    var p=pal().rgb;
    ctx.fillStyle="rgba("+p[0]+","+p[1]+","+p[2]+","+(G.flash*0.16).toFixed(3)+")";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
  }
  if(G.lostTimer>0){
    var k=0.10+0.10*Math.sin(G.time*6);
    ctx.fillStyle="rgba(255,20,20,"+(k*(G.lostTimer/LOST_GRACE)).toFixed(3)+")";
    ctx.fillRect(0,0,W,H);
  }
}

var mstars=null;
function drawMenuBg(){
  if(!mstars){
    mstars=[];
    for(var i=0;i<70;i++)mstars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.6,1.8),p:Math.random()*6.283});
  }
  ctx.globalCompositeOperation="lighter";
  for(var j=0;j<mstars.length;j++){
    var s=mstars[j];
    var a=0.12+0.12*Math.sin(G.time*1.2+s.p);
    ctx.fillStyle="rgba(0,229,255,"+a.toFixed(3)+")";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
  }
  var rr=((G.time*90)%700);
  ctx.strokeStyle="rgba(0,229,255,"+((1-rr/700)*0.30).toFixed(3)+")";
  ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,rr,0,6.283);ctx.stroke();
  ctx.globalCompositeOperation="source-over";
}

var hc={t:"",l:"",p:"",b:"",s:"",lost:""};
function updateHUD(){
  var t=fmt(G.elapsed);if(t!==hc.t){hc.t=t;hTime.textContent=t;}
  var l=(G.level+1)+"/5";if(l!==hc.l){hc.l=l;hLevel.textContent=l;}
  var p=""+G.pings;if(p!==hc.p){hc.p=p;hPings.textContent=p;}
  var b=""+G.totalBat;if(b!==hc.b){hc.b=b;hBat.textContent=b;}
  var s=""+computeScore(false);if(s!==hc.s){hc.s=s;hScore.textContent=s;}
  var lo=G.lostTimer>0?("Signal lost in "+Math.ceil(LOST_GRACE-G.lostTimer)):"";
  if(lo!==hc.lost){hc.lost=lo;hLost.textContent=lo;hLost.style.display=lo?"block":"none";}
}

/* ============================ FLOW ============================ */
function resetAll(){
  waves.length=0;parts.length=0;uparts.length=0;prints.length=0;
  enemies.length=0;items.length=0;segs.length=0;
  grid=null;waveId=0;
  G.level=0;G.pings=7;G.batteries=0;G.totalBat=0;G.elapsed=0;G.score=0;
  G.lastPing=-9999;G.lostTimer=0;G.flash=0;G.shake=0;G.deathT=0;
  keys={};joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;
  knob.style.transform="";
  hc={t:"",l:"",p:"",b:"",s:"",lost:""};
  lastEntry=null;
  camX=0;camY=0;
}
function startGame(){
  closeOv();
  resetAll();
  IN.clear();
  bindInput();
  lockLandscape();
  AU.init();AU.resume();AU.vol(0.85);AU.startAmbient();
  initLevel();
  P.alive=true;
  G.state="play";
  updateHUD();
}
function pause(){
  if(G.state!=="play")return;
  G.state="pause";
  AU.vol(0.12);
  showPause();
}
function resume(){
  if(G.state!=="pause")return;
  closeOv();
  AU.resume();AU.vol(0.85);
  G.state="play";
}
function lockLandscape(){
  try{
    if(screen.orientation&&screen.orientation.lock){
      var r=screen.orientation.lock("landscape");
      if(r&&r.catch)r.catch(function(){});
    }
  }catch(e){}
}

/* ============================ INPUT ============================ */
var CODES={ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1,Space:1,KeyW:1,KeyA:1,KeyS:1,KeyD:1};
function bindInput(){
  IN.on(window,"keydown",function(e){
    var c=e.code||"";
    if(CODES[c])e.preventDefault();
    if(c==="Space"){ AU.resume(); ping(); return; }
    if(c==="Escape"){ if(G.state==="play")pause(); else if(G.state==="pause")resume(); return; }
    keys[c]=true;
  });
  IN.on(window,"keyup",function(e){
    var c=e.code||"";
    if(CODES[c])e.preventDefault();
    keys[c]=false;
  });
  IN.on(wrap,"pointerdown",function(e){
    if(G.state!=="play")return;
    AU.resume();
    var jr=joyEl.getBoundingClientRect();
    var inJoy=TOUCH&&e.clientX>=jr.left-24&&e.clientX<=jr.right+24&&e.clientY>=jr.top-24&&e.clientY<=jr.bottom+24;
    if(inJoy){
      joy.on=true;joy.id=e.pointerId;
      joy.cx=jr.left+jr.width/2;joy.cy=jr.top+jr.height/2;joy.rad=jr.width/2;
      moveJoy(e.clientX,e.clientY);
      try{wrap.setPointerCapture(e.pointerId);}catch(err){}
    }else{
      ping();
    }
    e.preventDefault();
  });
  IN.on(wrap,"pointermove",function(e){
    if(joy.on&&e.pointerId===joy.id){moveJoy(e.clientX,e.clientY);e.preventDefault();}
  });
  IN.on(wrap,"pointerup",endJoy);
  IN.on(wrap,"pointercancel",endJoy);
  IN.on(wrap,"contextmenu",function(e){e.preventDefault();});
}
function moveJoy(x,y){
  var dx=x-joy.cx, dy=y-joy.cy;
  var l=Math.sqrt(dx*dx+dy*dy);
  var m=joy.rad;
  var kx=dx,ky=dy;
  if(l>m){kx=dx/l*m;ky=dy/l*m;}
  joy.dx=kx/m;joy.dy=ky/m;
  if(l<m*0.16){joy.dx=0;joy.dy=0;}
  knob.style.transform="translate("+kx.toFixed(1)+"px,"+ky.toFixed(1)+"px)";
}
function endJoy(e){
  if(joy.on&&e.pointerId===joy.id){
    joy.on=false;joy.id=-1;joy.dx=0;joy.dy=0;
    knob.style.transform="";
    try{wrap.releasePointerCapture(e.pointerId);}catch(err){}
  }
}

/* ============================ LAYOUT ============================ */
function layout(){
  var r=stage.getBoundingClientRect();
  var ar=W/H;
  var w=r.width, h=w/ar;
  if(h>r.height){h=r.height;w=h*ar;}
  wrap.style.width=Math.max(40,Math.floor(w))+"px";
  wrap.style.height=Math.max(30,Math.floor(h))+"px";
  G.zoom=(window.innerWidth<1000)?1.95:1;
  if(G.zoom<=1.001){camX=0;camY=0;}
  joyEl.className=TOUCH?"on":"";
  hint.style.display=TOUCH?"none":"block";
}

/* ============================ LOOP ============================ */
var last=0, acc=0, raf=0;
function update(dt){
  G.time+=dt;
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.8);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*2.2);
  if(G.state==="dying"){
    G.deathT+=dt;
    updateParticles(dt);
    updateWallFade(dt);
    if(G.deathT>0.75)gameOver("Caught in the dark");
    return;
  }
  if(G.state!=="play")return;
  G.elapsed+=dt;
  updateMovers();
  updatePlayer(dt);
  updateEnemies(dt);
  updateWaves(dt);
  updateWallFade(dt);
  updateParticles(dt);
  checkCollect();
  checkExit();
  if(G.state!=="play")return;
  checkEnemies();
  if(G.state!=="play")return;
  lossCheck(dt);
  AU.tick(dt);
  updateHUD();
}
function loop(now){
  raf=requestAnimationFrame(loop);
  if(!last)last=now;
  var dt=(now-last)/1000;
  last=now;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  var did=false, guard=0;
  while(acc>=STEP&&guard<5){ update(STEP); acc-=STEP; did=true; guard++; }
  if(acc>0.5)acc=0;
  if(did)render();
}

/* ============================ BOOT ============================ */
function bindGlobal(){
  GLOBAL.on(window,"resize",function(){layout();pause();});
  GLOBAL.on(window,"orientationchange",function(){layout();pause();});
  GLOBAL.on(window,"blur",function(){pause();});
  GLOBAL.on(document,"visibilitychange",function(){if(document.hidden)pause();});
  GLOBAL.on(window,"pointerdown",function(){AU.init();AU.resume();},{once:false});
}
buildGlows();
layout();
bindGlobal();
showMenu();
render();
raf=requestAnimationFrame(loop);
void raf;
})();
</script>
